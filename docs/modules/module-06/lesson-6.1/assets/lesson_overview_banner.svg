<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e0234e"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="150" cy="80" r="160" fill="#e0234e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="320" r="180" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="140" fill="#34d399" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Header Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#e0234e"/>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      NESTJS PRACTICAL • MODULE 06 • LESSON 6.1
    </text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      WebSockets Gateway: Khởi Tạo Gateway Với Socket.IO
    </text>
    <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Kết Nối Hai Chiều Full-Duplex • Vòng Đời Connection Lifecycle • @SubscribeMessage &amp; Broadcast Event
    </text>
  </g>

  <!-- Pipeline Cards Row -->
  <g transform="translate(60, 185)">
    <!-- Step 1 Card: HTTP Upgrade Handshake -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#nestGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#e0234e" fill-opacity="0.15"/>
      <!-- Icon: Upgrade arrows -->
      <path d="M 32 39 L 32 27 M 32 27 L 27 32 M 32 27 L 37 32" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 42 27 L 42 39 M 42 39 L 37 34 M 42 39 L 47 34" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. 101 Handshake</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">HTTP Upgrade RFC 6455</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Nâng cấp từ HTTP GET 101</tspan>
        <tspan x="18" dy="20">• Duy trì duy nhất 1 TCP Socket</tspan>
        <tspan x="18" dy="20">• Triệt tiêu 95% header latency</tspan>
      </text>
      <rect x="18" y="136" width="115" height="22" rx="6" fill="#e0234e" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#fb7185" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Full-Duplex TCP</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(253, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 2 Card: Socket.IO Engine -->
    <g transform="translate(280, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#blueGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.15"/>
      <!-- Icon: Socket.IO logo silhouette / Network Hub -->
      <circle cx="37" cy="39" r="10" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M 33 39 L 36 43 L 42 35" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Socket.IO Core</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">@WebSocketGateway()</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Cấu hình CORS &amp; Namespace</tspan>
        <tspan x="18" dy="20">• Tự động fallback polling</tspan>
        <tspan x="18" dy="20">• Cơ chế Auto-reconnection</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#0284c7" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">IoAdapter Engine</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(533, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 3 Card: Lifecycle Hooks -->
    <g transform="translate(560, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#secGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#059669" fill-opacity="0.15"/>
      <!-- Icon: Lifecycle loop / Refresh -->
      <path d="M 37 28 A 10 10 0 1 1 27 38" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
      <polygon points="37,25 41,29 34,31" fill="#34d399"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Lifecycle Hooks</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Connection Tracking</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• OnGatewayInit: server ready</tspan>
        <tspan x="18" dy="20">• OnGatewayConnection(client)</tspan>
        <tspan x="18" dy="20">• OnGatewayDisconnect(client)</tspan>
      </text>
      <rect x="18" y="136" width="115" height="22" rx="6" fill="#059669" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Client Presence</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(813, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 4 Card: Event Routing & Broadcast -->
    <g transform="translate(840, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#purpleGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#7e22ce" fill-opacity="0.15"/>
      <!-- Icon: Antenna broadcast -->
      <circle cx="37" cy="40" r="2.5" fill="#c084fc"/>
      <path d="M 31 34 A 8 8 0 0 1 43 34" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 27 29 A 14 14 0 0 1 47 29" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Event Routing</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">@SubscribeMessage</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• @MessageBody() trích xuất dữ liệu</tspan>
        <tspan x="18" dy="20">• Phản hồi Acknowledge trực tiếp</tspan>
        <tspan x="18" dy="20">• server.emit() phát tin đa tab</tspan>
      </text>
      <rect x="18" y="136" width="115" height="22" rx="6" fill="#7e22ce" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#c084fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Event Dispatcher</text>
    </g>
  </g>
</svg>
