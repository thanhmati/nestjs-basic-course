<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nestRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea2845"/>
      <stop offset="100%" stop-color="#e0234e"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect width="796" height="596" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Circuit Background Lines -->
  <path d="M 50 100 L 250 100 L 300 150 L 300 450 L 250 500 L 50 500" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 750 100 L 550 100 L 500 150 L 500 450 L 550 500 L 750 500" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Main Shield Outer Glow -->
  <circle cx="400" cy="240" r="120" fill="#e0234e" opacity="0.15" filter="url(#glow)"/>

  <!-- NestJS Logo Polygon Emblem -->
  <g transform="translate(320, 160) scale(1.6)">
    <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" fill="url(#nestRed)"/>
    <!-- Stylized Cat/Nest Silhouette -->
    <path d="M 30 45 Q 35 25 50 35 Q 65 25 70 45 Q 25 65 30 45 Z" fill="#ffffff"/>
    <polygon points="35,32 42,40 32,42" fill="#e0234e"/>
    <polygon points="65,32 58,40 68,42" fill="#e0234e"/>
  </g>

  <!-- Main Text -->
  <text x="400" y="380" font-family="Inter, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="2">NESTJS</text>
  <text x="400" y="415" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="url(#cyanGlow)" text-anchor="middle" letter-spacing="4">THE PROGRESSIVE NODE.JS FRAMEWORK</text>

  <!-- Feature Badges -->
  <g transform="translate(140, 480)">
    <rect width="150" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="27" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">TypeScript First</text>
  </g>

  <g transform="translate(325, 480)">
    <rect width="150" height="44" rx="22" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="27" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#f43f5e" text-anchor="middle">Modular Architecture</text>
  </g>

  <g transform="translate(510, 480)">
    <rect width="150" height="44" rx="22" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="75" y="27" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#4ade80" text-anchor="middle">Enterprise Ready</text>
  </g>
</svg>
