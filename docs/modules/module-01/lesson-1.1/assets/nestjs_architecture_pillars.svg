<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="800" height="650" rx="16" fill="url(#bgGrad2)"/>
  <rect width="796" height="646" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Title -->
  <text x="400" y="45" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">NESTJS ARCHITECTURE DATA FLOW</text>

  <!-- Client Box -->
  <g transform="translate(60, 90)">
    <rect width="180" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" text-anchor="middle">CLIENT APP</text>
    <text x="90" y="52" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">React / Next.js / Postman</text>
  </g>

  <!-- Arrow Client -> Controller -->
  <path d="M 240 125 L 340 125" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="290" y="115" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">HTTP Request</text>

  <!-- Module Container Box -->
  <rect x="330" y="70" width="410" height="420" rx="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="350" y="96" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#f43f5e">MODULE (Encapsulation Boundary)</text>

  <!-- Controller Box -->
  <g transform="translate(360, 110)">
    <rect width="350" height="90" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="25" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="18" fill="#f43f5e">1. CONTROLLER</text>
    <text x="25" y="60" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">• Handles HTTP Endpoints (@Get, @Post)</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">• Validates Request DTOs</text>
  </g>

  <!-- Arrow Controller -> Service -->
  <path d="M 535 200 L 535 250" fill="none" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="610" y="230" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#f43f5e" text-anchor="middle">Delegates Execution</text>

  <!-- Service Box -->
  <g transform="translate(360, 260)">
    <rect width="350" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="18" fill="#38bdf8">2. SERVICE (PROVIDER)</text>
    <text x="25" y="60" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">• Business Logic Execution</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">• Dependency Injection (@Injectable)</text>
  </g>

  <!-- Arrow Service -> Database -->
  <path d="M 535 350 L 535 520" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="610" y="440" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#4ade80" text-anchor="middle">Prisma ORM Query</text>

  <!-- Database Box -->
  <g transform="translate(360, 520)">
    <rect width="350" height="80" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="175" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="18" fill="#4ade80" text-anchor="middle">POSTGRESQL DATABASE</text>
    <text x="175" y="58" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Persistent Data Storage</text>
  </g>
</svg>
