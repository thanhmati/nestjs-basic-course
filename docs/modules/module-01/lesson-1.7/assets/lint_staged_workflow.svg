<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400">
  <defs>
    <linearGradient id="bgGradWf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <filter id="shadowWf" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="400" rx="16" fill="url(#bgGradWf)"/>
  <rect width="836" height="396" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Flow Line Connecting Steps -->
  <path d="M 120 180 L 720 180" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- Step 1: Git Commit -->
  <g transform="translate(40, 100)" filter="url(#shadowWf)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#f05032" stroke-width="2"/>
    <circle cx="70" cy="45" r="22" fill="#f05032" opacity="0.2"/>
    <!-- Git Icon -->
    <path d="M 70 30 L 60 40 L 65 40 L 65 52 A 6 6 0 1 0 75 52 L 75 40 L 80 40 Z" fill="#f05032"/>
    <text x="70" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. git commit</text>
    <text x="70" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dev gõ lệnh</text>
    <text x="70" y="134" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">tạo commit mới</text>
  </g>

  <!-- Step 2: Husky Pre-commit -->
  <g transform="translate(230, 100)" filter="url(#shadowWf)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <circle cx="70" cy="45" r="22" fill="#22c55e" opacity="0.2"/>
    <!-- Shield / Hook Icon -->
    <path d="M 70 28 L 82 34 V 46 C 82 54 75 60 70 62 C 65 60 58 54 58 46 V 34 Z" fill="#22c55e"/>
    <text x="70" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. Husky Hook</text>
    <text x="70" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Kích hoạt script</text>
    <text x="70" y="134" font-family="JetBrains Mono, monospace" font-size="10" fill="#4ade80" text-anchor="middle">.husky/pre-commit</text>
  </g>

  <!-- Step 3: Lint-staged Filtering -->
  <g transform="translate(420, 100)" filter="url(#shadowWf)">
    <rect width="150" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="75" cy="45" r="22" fill="#f59e0b" opacity="0.2"/>
    <!-- Funnel / Filter Icon -->
    <path d="M 60 32 L 90 32 L 80 46 L 80 58 L 70 54 L 70 46 Z" fill="#f59e0b"/>
    <text x="75" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. Lint-staged</text>
    <text x="75" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Lọc file Staged</text>
    <text x="75" y="134" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">Chạy Lint &amp; Format</text>
  </g>

  <!-- Step 4A: Success & Auto-re-stage -->
  <g transform="translate(630, 40)" filter="url(#shadowWf)">
    <rect width="170" height="120" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="85" cy="35" r="18" fill="#10b981" opacity="0.3"/>
    <path d="M 77 35 L 82 40 L 93 29" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">PASS &amp; Re-stage</text>
    <text x="85" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Auto git add &amp; Commit ghi nhận</text>
  </g>

  <!-- Step 4B: Fail & Block -->
  <g transform="translate(630, 220)" filter="url(#shadowWf)">
    <rect width="170" height="120" rx="12" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="85" cy="35" r="18" fill="#f43f5e" opacity="0.3"/>
    <path d="M 77 27 L 93 43 M 93 27 L 77 43" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle">FAIL (Exit 1)</text>
    <text x="85" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fecdd3" text-anchor="middle">Hủy Commit &amp; Báo lỗi dòng code</text>
  </g>

  <!-- Branching Arrows from Step 3 to Step 4A and 4B -->
  <path d="M 570 150 L 600 150 L 600 100 L 625 100" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 570 210 L 600 210 L 600 280 L 625 280" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Bottom Legend Banner -->
  <rect width="760" height="34" x="40" y="345" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="420" y="367" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan font-weight="700" fill="#f59e0b">Lợi ích cốt lõi:</tspan> Chỉ định dạng &amp; kiểm tra các tệp vừa sửa (<tspan fill="#34d399">Staged Files</tspan>), tiết kiệm 90% thời gian so với lint toàn bộ dự án!
  </text>
</svg>
