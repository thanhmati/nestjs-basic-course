<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lintStagedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="eslintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="prettierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    
    <filter id="glow17" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad17)"/>
  <rect width="796" height="446" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Decorative Circuit Lines -->
  <path d="M 50 100 L 180 100 L 220 140 L 220 310 L 180 350 L 50 350" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 750 100 L 620 100 L 580 140 L 580 310 L 620 350 L 750 350" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Central Badge Glow -->
  <circle cx="400" cy="165" r="90" fill="#f59e0b" opacity="0.15" filter="url(#glow17)"/>

  <!-- Central Badge: Speed & Filtering Icon -->
  <g transform="translate(340, 105) scale(1.2)">
    <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" fill="url(#lintStagedGrad)"/>
    <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="#0f172a"/>
    
    <!-- Filter Funnel & Lightning Icon -->
    <path d="M 28 32 L 72 32 L 56 54 L 56 72 L 44 66 L 44 54 Z" fill="none" stroke="url(#lintStagedGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 52 24 L 42 42 L 50 42 L 46 60 L 60 38 L 50 38 Z" fill="#f59e0b"/>
  </g>

  <!-- Left Card: Staged Files Filtering -->
  <g transform="translate(80, 140)">
    <rect width="210" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="210" height="34" rx="12" fill="#0f172a"/>
    <rect width="10" height="10" x="15" y="12" rx="5" fill="#ef4444"/>
    <rect width="10" height="10" x="32" y="12" rx="5" fill="#f59e0b"/>
    <rect width="10" height="10" x="49" y="12" rx="5" fill="#10b981"/>
    <text x="70" y="23" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Git Staging Area</text>
    
    <!-- File 1: Staged -->
    <g transform="translate(15, 46)">
      <rect width="180" height="24" rx="6" fill="#334155" opacity="0.5"/>
      <!-- File Icon -->
      <path d="M 12 6 H 18 L 22 10 V 18 H 12 Z" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="27" y="16" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">users.service.ts</text>
      <rect width="45" height="16" x="130" y="4" rx="4" fill="#34d399" opacity="0.2"/>
      <text x="135" y="16" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">STAGED</text>
    </g>

    <!-- File 2: Unstaged -->
    <g transform="translate(15, 78)">
      <rect width="180" height="24" rx="6" fill="#334155" opacity="0.2"/>
      <path d="M 12 6 H 18 L 22 10 V 18 H 12 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="27" y="16" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">app.module.ts</text>
      <text x="130" y="16" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Unstaged</text>
    </g>

    <!-- File 3: Staged -->
    <g transform="translate(15, 110)">
      <rect width="180" height="24" rx="6" fill="#334155" opacity="0.5"/>
      <path d="M 12 6 H 18 L 22 10 V 18 H 12 Z" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="27" y="16" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">README.md</text>
      <rect width="45" height="16" x="130" y="4" rx="4" fill="#34d399" opacity="0.2"/>
      <text x="135" y="16" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">STAGED</text>
    </g>
  </g>

  <!-- Connection Arrow Left -->
  <path d="M 298 215 L 330 215" fill="none" stroke="url(#lintStagedGrad)" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Right Card: Fast Pipeline (ESLint & Prettier) -->
  <g transform="translate(510, 140)">
    <rect width="210" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="210" height="34" rx="12" fill="#0f172a"/>
    <text x="20" y="23" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Auto-Fix &amp; Format</text>
    
    <g transform="translate(15, 48)">
      <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <circle cx="20" cy="19" r="10" fill="url(#eslintGrad)"/>
      <text x="20" y="23" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
      <text x="38" y="24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#818cf8">eslint --fix</text>
      <text x="138" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#34d399">0.4s</text>
    </g>

    <g transform="translate(15, 96)">
      <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="20" cy="19" r="10" fill="url(#prettierGrad)"/>
      <text x="20" y="23" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">P</text>
      <text x="38" y="24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#38bdf8">prettier --write</text>
      <text x="138" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#34d399">0.2s</text>
    </g>
  </g>

  <!-- Connection Arrow Right -->
  <path d="M 470 215 L 502 215" fill="none" stroke="url(#successGrad)" stroke-width="3"/>

  <!-- Titles -->
  <text x="400" y="340" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">
    Lint-staged Automation
  </text>
  <text x="400" y="375" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    Tự động hóa kiểm tra &amp; định dạng mã nguồn chỉ trên các file đang Staged
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(180, 395)">
    <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="65" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">⚡ Ultra Fast</text>

    <rect width="140" height="28" x="145" y="0" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="215" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">🎯 Staged Only</text>

    <rect width="130" height="28" x="300" y="0" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="365" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">✨ Auto Stage</text>
  </g>
</svg>
