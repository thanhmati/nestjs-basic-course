<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="huskyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#f05032"/>
    </linearGradient>
    <linearGradient id="cyanGlow16" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow16" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad16)"/>
  <rect width="796" height="446" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Circuit Decorative Lines -->
  <path d="M 40 80 L 220 80 L 260 120 L 260 330 L 220 370 L 40 370" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 760 80 L 580 80 L 540 120 L 540 330 L 580 370 L 760 370" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Center Emblem Glow -->
  <circle cx="400" cy="170" r="85" fill="#22c55e" opacity="0.12" filter="url(#glow16)"/>

  <!-- Central Badge Icon -->
  <g transform="translate(345, 115) scale(1.1)">
    <!-- Hexagon Outer -->
    <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" fill="url(#huskyGreen)" rx="8"/>
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#0f172a"/>
    <!-- Dog / Husky Icon Mask -->
    <path d="M 32 35 L 50 22 L 68 35 L 62 65 L 50 72 L 38 65 Z" fill="url(#huskyGreen)"/>
    <polygon points="50,30 58,45 42,45" fill="#ffffff"/>
    <circle cx="43" cy="40" r="2.5" fill="#0f172a"/>
    <circle cx="57" cy="40" r="2.5" fill="#0f172a"/>
    <polygon points="50,52 45,47 55,47" fill="#0f172a"/>
  </g>

  <!-- Titles -->
  <text x="400" y="275" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GIT HOOKS &amp; HUSKY v9</text>
  <text x="400" y="310" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="url(#cyanGlow16)" text-anchor="middle" letter-spacing="3">AUTOMATED PRE-COMMIT QUALITY GUARD</text>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(100, 360)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#f05032" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="10" fill="#f05032"/>
    <text x="26" y="25" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">Git</text>
    <text x="108" y="26" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">pre-commit</text>
  </g>

  <g transform="translate(310, 360)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="10" fill="#22c55e"/>
    <text x="26" y="25" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">v9</text>
    <text x="108" y="26" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">Husky Automation</text>
  </g>

  <g transform="translate(520, 360)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="10" fill="#38bdf8"/>
    <text x="26" y="25" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#0f172a" text-anchor="middle">TS</text>
    <text x="108" y="26" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc" text-anchor="middle">ESLint &amp; Quality</text>
  </g>
</svg>
