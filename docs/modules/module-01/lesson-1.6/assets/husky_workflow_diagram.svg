<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGradFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGradFlow)"/>
  <rect width="796" height="476" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title Section -->
  <text x="400" y="45" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="1">PRE-COMMIT HOOK EXECUTION WORKFLOW</text>
  <text x="400" y="70" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">Cơ chế chặn mã nguồn chứa lỗi trước khi tạo Git Commit</text>

  <!-- Step 1: Dev Terminal -->
  <g transform="translate(40, 130)" filter="url(#shadow)">
    <rect width="180" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="180" height="28" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="14" r="4" fill="#f43f5e"/>
    <circle cx="34" cy="14" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="14" r="4" fill="#4ade80"/>
    <text x="90" y="19" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">Terminal</text>
    
    <text x="90" y="60" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle">1. DEVELOPER</text>
    <rect x="20" y="75" width="140" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="90" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#4ade80" text-anchor="middle">$ git commit</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 195 L 285 195" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="295,195 282,188 282,202" fill="#38bdf8"/>

  <!-- Step 2: Husky Intercept -->
  <g transform="translate(295, 115)" filter="url(#shadow)">
    <rect width="210" height="160" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <text x="105" y="35" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="15" fill="#4ade80" text-anchor="middle">2. HUSKY v9 INTERCEPT</text>
    <line x1="20" y1="48" x2="190" y2="48" stroke="#334155" stroke-width="1"/>
    
    <text x="105" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">.husky/pre-commit</text>
    
    <rect x="25" y="85" width="160" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="108" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" fill="#fbbf24" text-anchor="middle">⚡ Runs: pnpm lint</text>
    <text x="105" y="127" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(ESLint Code Scan)</text>
  </g>

  <!-- Arrow 2 -> Success Branch -->
  <path d="M 505 195 L 575 195" fill="none" stroke="#4ade80" stroke-width="3"/>
  <polygon points="585,195 572,188 572,202" fill="#4ade80"/>
  <text x="545" y="182" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#4ade80" text-anchor="middle">PASS (0 Errors)</text>

  <!-- Step 3: Git Success -->
  <g transform="translate(585, 130)" filter="url(#shadow)">
    <rect width="175" height="130" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="87" y="45" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#4ade80" text-anchor="middle">3. GIT REPOSITORY</text>
    <circle cx="87" cy="80" r="18" fill="#4ade80" opacity="0.2"/>
    <path d="M 78 80 L 84 86 L 96 74" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <text x="87" y="115" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#cbd5e1" text-anchor="middle">Commit Recorded</text>
  </g>

  <!-- Branch Fail Downward Arrow -->
  <path d="M 400 275 L 400 335" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="400,345 393,332 407,332" fill="#f43f5e"/>
  <text x="445" y="310" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#f43f5e">FAIL (Lint Error)</text>

  <!-- Step 4: Blocked Error Box -->
  <g transform="translate(210, 345)" filter="url(#shadow)">
    <rect width="380" height="105" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="190" y="32" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#f43f5e" text-anchor="middle">🚫 COMMIT ABORTED (Exit Code 1)</text>
    <text x="190" y="58" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Husky chặn không cho lưu commit rác chứa lỗi vào Git.</text>
    <text x="190" y="80" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">🔧 Yêu cầu Dev sửa lỗi ESLint &amp; chạy lại lệnh commit</text>
  </g>
</svg>
