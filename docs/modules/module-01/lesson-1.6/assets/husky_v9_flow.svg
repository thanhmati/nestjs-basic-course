<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="16" fill="url(#bgGrad16)"/>
  <rect width="796" height="596" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="50" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">HUSKY V9 GIT HOOK WORKFLOW</text>

  <!-- Step 1: Init Box -->
  <g transform="translate(40, 90)">
    <rect width="720" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="35" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8">1. SETUP (One-Time Execution)</text>
    <text x="30" y="65" font-family="monospace" font-size="13" fill="#cbd5e1">pnpm exec husky init  ➔  Creates .husky/ &amp; adds "prepare": "husky" to package.json</text>
  </g>

  <!-- Step 2: Git Commit Flow Box -->
  <g transform="translate(40, 210)">
    <rect width="720" height="340" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="30" y="35" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#f43f5e">2. RUNTIME PRE-COMMIT EXECUTION FLOW</text>

    <!-- Node 1: Dev -->
    <g transform="translate(30, 60)">
      <rect width="180" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="35" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">Developer</text>
      <text x="90" y="58" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">git commit -m "..."</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 210 100 L 260 100" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <polygon points="260,100 252,95 252,105" fill="#38bdf8"/>

    <!-- Node 2: Pre-commit Hook -->
    <g transform="translate(260, 60)">
      <rect width="200" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="100" y="35" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#f43f5e" text-anchor="middle">.husky/pre-commit</text>
      <text x="100" y="58" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">pnpm lint</text>
    </g>

    <!-- Branch Arrows -->
    <!-- Pass Path -->
    <path d="M 460 85 L 530 85 L 530 65 L 560 65" stroke="#4ade80" stroke-width="2" fill="none"/>
    <polygon points="560,65 552,60 552,70" fill="#4ade80"/>

    <g transform="translate(560, 35)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="65" y="35" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#4ade80" text-anchor="middle">COMMIT SUCCESS</text>
    </g>

    <!-- Fail Path -->
    <path d="M 460 115 L 530 115 L 530 150 L 560 150" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <polygon points="560,150 552,145 552,155" fill="#f43f5e"/>

    <g transform="translate(560, 120)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="65" y="35" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#f43f5e" text-anchor="middle">COMMIT ABORTED</text>
    </g>

    <!-- Note Box inside Flow -->
    <rect x="30" y="170" width="660" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="200" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#fbbf24">💡 Tại sao chọn Husky v9?</text>
    <text x="50" y="230" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Đồng bộ cấu hình .husky/ qua Git mà không sửa trực tiếp .git/hooks/</text>
    <text x="50" y="260" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Cấu hình siêu ngắn gọn: Chỉ 1 câu lệnh "pnpm exec husky init"</text>
    <text x="50" y="285" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Đội ngũ thành viên mới chỉ cần "pnpm install" là tự có sẵn Git Hooks</text>
  </g>
</svg>
