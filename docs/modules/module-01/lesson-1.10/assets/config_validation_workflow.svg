<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400">
  <defs>
    <linearGradient id="bgGradWf110" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadowWf110" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="400" rx="16" fill="url(#bgGradWf110)"/>
  <rect width="836" height="396" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Flow Line Connecting Steps -->
  <path d="M 120 180 L 720 180" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- Step 1: .env File -->
  <g transform="translate(40, 100)" filter="url(#shadowWf110)">
    <rect width="140" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="70" cy="45" r="22" fill="#38bdf8" opacity="0.2"/>
    <!-- File Icon -->
    <path d="M 60 32 H 74 L 82 40 V 58 H 60 Z" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="70" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. .env File</text>
    <text x="70" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Đọc biến thô</text>
    <text x="70" y="134" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">process.env</text>
  </g>

  <!-- Step 2: Joi Validation Schema -->
  <g transform="translate(230, 100)" filter="url(#shadowWf110)">
    <rect width="150" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="75" cy="45" r="22" fill="#f59e0b" opacity="0.2"/>
    <!-- Shield / Check Icon -->
    <path d="M 75 28 L 87 34 V 46 C 87 54 80 60 75 62 C 70 60 63 54 63 46 V 34 Z" fill="#f59e0b"/>
    <path d="M 70 45 L 74 49 L 81 41" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="75" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. Joi Schema</text>
    <text x="75" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Validate type &amp; default</text>
    <text x="75" y="134" font-family="JetBrains Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">validationSchema</text>
  </g>

  <!-- Step 3: ConfigModule Global -->
  <g transform="translate(430, 100)" filter="url(#shadowWf110)">
    <rect width="150" height="160" rx="12" fill="#1e293b" stroke="#e0234e" stroke-width="2"/>
    <circle cx="75" cy="45" r="22" fill="#e0234e" opacity="0.2"/>
    <!-- Module Box Icon -->
    <rect width="24" height="24" x="63" y="33" rx="4" fill="none" stroke="#e0234e" stroke-width="2.5"/>
    <text x="75" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. ConfigModule</text>
    <text x="75" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Đóng gói toàn cục</text>
    <text x="75" y="134" font-family="JetBrains Mono, monospace" font-size="10" fill="#e0234e" text-anchor="middle">isGlobal: true</text>
  </g>

  <!-- Step 4A: Valid & Boot Success -->
  <g transform="translate(630, 40)" filter="url(#shadowWf110)">
    <rect width="170" height="120" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="85" cy="35" r="18" fill="#10b981" opacity="0.3"/>
    <path d="M 77 35 L 82 40 L 93 29" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">PASS &amp; Boot Server</text>
    <text x="85" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Type-safe config.get()</text>
  </g>

  <!-- Step 4B: Invalid & Boot Crash -->
  <g transform="translate(630, 220)" filter="url(#shadowWf110)">
    <rect width="170" height="120" rx="12" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="85" cy="35" r="18" fill="#f43f5e" opacity="0.3"/>
    <path d="M 77 27 L 93 43 M 93 27 L 77 43" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle">BOOT CRASH (Exit 1)</text>
    <text x="85" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fecdd3" text-anchor="middle">Báo rõ biến .env bị thiếu/sai</text>
  </g>

  <!-- Branching Arrows -->
  <path d="M 580 150 L 600 150 L 600 100 L 625 100" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 580 210 L 600 210 L 600 280 L 625 280" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Bottom Legend Banner -->
  <rect width="760" height="34" x="40" y="345" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="420" y="367" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    💡 <tspan font-weight="700" fill="#f59e0b">Lợi ích cốt lõi:</tspan> Ngăn chặn hoàn toàn việc app khởi chạy khi thiếu biến môi trường quan trọng (DB_URL, JWT_SECRET)!
  </text>
</svg>
