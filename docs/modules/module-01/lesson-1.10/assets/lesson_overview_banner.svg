<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad110" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="joiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="nestjsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0234e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="glow110" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" opacity="0.4"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad110)"/>
  <rect width="796" height="446" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="160" r="95" fill="#34d399" opacity="0.12" filter="url(#glow110)"/>

  <!-- Central Badge: Shield & Gear Icon -->
  <g transform="translate(340, 95) scale(1.2)">
    <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" fill="url(#envGrad)"/>
    <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="#0f172a"/>
    
    <!-- Key / Shield Icon -->
    <path d="M 50 25 L 70 34 V 52 C 70 64 50 74 50 74 C 50 74 30 64 30 52 V 34 Z" fill="none" stroke="url(#envGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="50" cy="45" r="7" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 50 52 V 62 M 46 58 H 54" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Card: Raw .env File -->
  <g transform="translate(60, 135)">
    <rect width="210" height="150" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#0f172a"/>
    <text x="105" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">📄 .env File</text>

    <g transform="translate(15, 48)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">PORT=3000</text>
    </g>
    <g transform="translate(15, 78)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">DB_URL=postgres://...</text>
    </g>
    <g transform="translate(15, 108)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="10" fill="#f87171">NODE_ENV=dev (Unsafe)</text>
    </g>
  </g>

  <!-- Right Card: Joi Schema & ConfigService -->
  <g transform="translate(530, 135)">
    <rect width="210" height="150" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#064e3b"/>
    <text x="105" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">ConfigService + Joi</text>

    <g transform="translate(15, 48)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="10" fill="#f59e0b">Joi.number().required()</text>
    </g>
    <g transform="translate(15, 78)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399">Type-safe config.get()</text>
    </g>
    <g transform="translate(15, 108)">
      <rect width="180" height="24" rx="6" fill="#0f172a"/>
      <text x="12" y="16" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#a7f3d0">🛡️ Boot Crash On Error</text>
    </g>
  </g>

  <!-- Connection Lines -->
  <path d="M 270 210 L 330 210" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 470 210 L 530 210" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Titles -->
  <text x="400" y="335" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">
    Environment Configuration &amp; Joi
  </text>
  <text x="400" y="370" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    Đọc biến môi trường an toàn, chuẩn hóa kiểu dữ liệu &amp; tự động ngăn chặn boot khi thiếu biến .env
  </text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(170, 395)">
    <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#e0234e" stroke-width="1"/>
    <text x="70" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0234e" text-anchor="middle">@nestjs/config</text>

    <rect width="140" height="28" x="160" y="0" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="230" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Joi Validation</text>

    <rect width="140" height="28" x="320" y="0" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="390" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">ConfigService</text>
  </g>
</svg>
