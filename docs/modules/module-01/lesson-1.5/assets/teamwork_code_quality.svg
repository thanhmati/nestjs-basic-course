<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" fill="url(#bgGrad15)"/>
  <rect width="796" height="596" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header Title -->
  <text x="400" y="55" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">AUTOMATED CODE QUALITY PIPELINE</text>
  <text x="400" y="80" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">Zero human-error before Git Commit</text>

  <!-- Developer Box -->
  <g transform="translate(50, 150)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="45" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8" text-anchor="middle">DEVELOPER</text>
    <text x="90" y="75" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">git commit</text>
  </g>

  <!-- Arrow Dev -> Husky -->
  <path d="M 230 210 L 300 210" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="300,210 290,203 290,217" fill="#38bdf8"/>

  <!-- Husky Guard Box -->
  <g transform="translate(310, 130)">
    <rect width="180" height="160" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="90" y="35" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#f43f5e" text-anchor="middle">HUSKY (Git Hook)</text>
    <line x1="20" y1="50" x2="160" y2="50" stroke="#334155" stroke-width="1"/>
    <text x="90" y="75" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">1. Lint-staged (ESLint)</text>
    <text x="90" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">2. Prettier Format</text>
    <text x="90" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">3. Commitlint Check</text>
  </g>

  <!-- Arrow Pass -> Git Repos -->
  <path d="M 490 210 L 560 210" fill="none" stroke="#4ade80" stroke-width="3"/>
  <polygon points="560,210 550,203 550,217" fill="#4ade80"/>
  <text x="525" y="195" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#4ade80" text-anchor="middle">PASS</text>

  <!-- Git Repository Box -->
  <g transform="translate(570, 150)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="90" y="45" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#4ade80" text-anchor="middle">GIT REPO</text>
    <text x="90" y="75" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Clean Commit</text>
  </g>

  <!-- Reject Arrow -->
  <path d="M 400 290 L 400 360" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="400,360 393,350 407,350" fill="#f43f5e"/>
  <text x="440" y="330" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#f43f5e">FAIL (Aborted)</text>

  <!-- Error Card -->
  <g transform="translate(230, 370)">
    <rect width="340" height="170" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="170" y="32" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#f43f5e" text-anchor="middle">TỰ ĐỘNG CHẶN KHI CÓ LỖI</text>
    <text x="30" y="65" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Code thừa biến, sai syntax ESLint</text>
    <text x="30" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Format thụt lề thụt ra không đồng nhất</text>
    <text x="30" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Commit message không chuẩn Conventional</text>
  </g>
</svg>
