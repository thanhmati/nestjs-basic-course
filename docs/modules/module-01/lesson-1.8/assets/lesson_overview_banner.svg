<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="commitlintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gitRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="successGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glow18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" opacity="0.4"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad18)"/>
  <rect width="796" height="446" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="160" r="90" fill="#818cf8" opacity="0.15" filter="url(#glow18)"/>

  <!-- Central Badge: Commitlint Shield & Check Mark Icon -->
  <g transform="translate(340, 100) scale(1.2)">
    <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" fill="url(#commitlintGrad)"/>
    <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="#0f172a"/>
    
    <!-- Shield / Check Icon -->
    <path d="M 50 25 L 72 35 V 55 C 72 68 50 78 50 78 C 50 78 28 68 28 55 V 35 Z" fill="none" stroke="url(#commitlintGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 40 50 L 47 57 L 62 42" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left Card: Invalid Commit Message -->
  <g transform="translate(70, 140)">
    <rect width="220" height="140" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="220" height="32" rx="12" fill="#450a0a"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <text x="35" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">❌ Invalid Commit</text>

    <g transform="translate(15, 45)">
      <rect width="190" height="26" rx="6" fill="#0f172a"/>
      <text x="12" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#f87171">"updated code"</text>
    </g>

    <g transform="translate(15, 78)">
      <rect width="190" height="26" rx="6" fill="#0f172a"/>
      <text x="12" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#f87171">"FIX BUG!!!"</text>
    </g>

    <text x="110" y="123" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Thiếu type, scope &amp; sai định dạng</text>
  </g>

  <!-- Connection Arrow Left -->
  <path d="M 300 210 L 330 210" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Right Card: Valid Conventional Commit -->
  <g transform="translate(510, 140)">
    <rect width="220" height="140" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="220" height="32" rx="12" fill="#064e3b"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="35" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">✅ Conventional Commit</text>

    <g transform="translate(15, 45)">
      <rect width="190" height="26" rx="6" fill="#0f172a"/>
      <text x="12" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399">feat(auth): add login</text>
    </g>

    <g transform="translate(15, 78)">
      <rect width="190" height="26" rx="6" fill="#0f172a"/>
      <text x="12" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399">fix(user): correct email</text>
    </g>

    <text x="110" y="123" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Chuẩn type(scope): description</text>
  </g>

  <!-- Connection Arrow Right -->
  <path d="M 470 210 L 500 210" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Titles -->
  <text x="400" y="335" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">
    Commitlint &amp; Conventional Commits
  </text>
  <text x="400" y="370" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    Tự động hóa kiểm tra &amp; giữ thông điệp Git Commit luôn chuẩn hóa chuyên nghiệp
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(160, 395)">
    <rect width="150" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="75" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Conventional Spec</text>

    <rect width="140" height="28" x="165" y="0" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="235" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">commit-msg Hook</text>

    <rect width="140" height="28" x="320" y="0" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="390" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Auto Changelog</text>
  </g>
</svg>
