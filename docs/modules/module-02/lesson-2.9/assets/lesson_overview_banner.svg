<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Rose Accent -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Orbs -->
  <circle cx="200" cy="100" r="150" fill="#f43f5e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Outer Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 2.9: Prisma Error Handling &amp; NestJS Exception Filter
    </text>
  </g>

  <!-- Left Column: Raw DB Error -->
  <g transform="translate(90, 115)" filter="url(#shadow)">
    <rect width="470" height="215" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="470" height="36" rx="12" fill="#881337" fill-opacity="0.4"/>
    
    <text x="20" y="24" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">
      ⚠️ RAW PRISMA ERROR (Uncaught Exception)
    </text>
    
    <!-- Code Snippet Box -->
    <text x="20" y="65" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="12">
      PrismaClientKnownRequestError [P2002]
    </text>
    <text x="20" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      Unique constraint failed on field: (`email`)
    </text>
    <text x="20" y="115" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      at PrismaClient.create (.../client.js:1420)
    </text>

    <!-- Arrow & Result -->
    <rect x="20" y="145" width="430" height="48" rx="8" fill="#450a0a"/>
    <text x="35" y="174" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
      🔴 HTTP Response: 500 Internal Server Error (Leak Stacktrace)
    </text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(580, 205)">
    <circle cx="20" cy="0" r="22" fill="#e11d48" filter="url(#glow)"/>
    <path d="M 12 -8 L 28 0 L 12 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Column: Standardized HTTP Exception -->
  <g transform="translate(640, 115)" filter="url(#shadow)">
    <rect width="470" height="215" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="470" height="36" rx="12" fill="#0369a1" fill-opacity="0.4"/>
    
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">
      🛡️ NESTJS EXCEPTION FILTER (Standardized)
    </text>
    
    <text x="20" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">
      @Catch(PrismaClientKnownRequestError)
    </text>
    <text x="20" y="90" fill="#a5f3fc" font-family="'JetBrains Mono', monospace" font-size="11">
      P2002 ➔ 409 Conflict | P2025 ➔ 404 Not Found
    </text>
    <text x="20" y="115" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      Transforms raw DB code into clean REST JSON
    </text>

    <!-- Success Result -->
    <rect x="20" y="145" width="430" height="48" rx="8" fill="#064e3b"/>
    <text x="35" y="174" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
      🟢 HTTP Response: 409 Conflict {"statusCode": 409, "message": "..."}
    </text>
  </g>
</svg>
