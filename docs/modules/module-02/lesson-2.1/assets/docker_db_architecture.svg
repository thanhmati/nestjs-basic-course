<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="dockerNetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#bg)"/>
  <rect width="1000" height="520" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    Kiến Trúc Multi-Container PostgreSQL &amp; Adminer qua Docker Compose
  </text>

  <!-- Host Machine Subgraph Area -->
  <rect x="50" y="70" width="900" height="420" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="100" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">
    💻 Host Machine (Local Environment)
  </text>

  <!-- Developer Browser / NestJS App -->
  <g transform="translate(80, 130)" filter="url(#shadow)">
    <rect width="200" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="45" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Web Browser</text>
    <text x="100" y="70" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="13">http://localhost:8080</text>
    <text x="100" y="90" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">(Adminer Web UI)</text>
  </g>

  <g transform="translate(80, 290)" filter="url(#shadow)">
    <rect width="200" height="110" rx="10" fill="#1e293b" stroke="#e0234e" stroke-width="1.5"/>
    <text x="100" y="45" text-anchor="middle" fill="#e0234e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">NestJS App / CLI</text>
    <text x="100" y="70" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="13">localhost:5432</text>
    <text x="100" y="90" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">(Prisma / psql)</text>
  </g>

  <!-- Docker Network Subgraph -->
  <g transform="translate(340, 110)">
    <rect width="580" height="340" rx="14" fill="url(#dockerNetGrad)" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="20" y="30" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">
      🐳 Docker Network: app_network (Bridge Mode)
    </text>
  </g>

  <!-- Adminer Container -->
  <g transform="translate(370, 160)" filter="url(#shadow)">
    <rect width="230" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="115" y="35" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Container: adminer</text>
    <text x="115" y="60" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Image: adminer:latest</text>
    <rect x="35" y="75" width="160" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="115" y="94" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">Port: 8080:8080</text>
  </g>

  <!-- Postgres Container -->
  <g transform="translate(370, 300)" filter="url(#shadow)">
    <rect width="230" height="130" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="115" y="35" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Container: postgres_db</text>
    <text x="115" y="60" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Image: postgres:16-alpine</text>
    <rect x="35" y="80" width="160" height="28" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
    <text x="115" y="99" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">Port: 5432:5432</text>
  </g>

  <!-- Docker Volume -->
  <g transform="translate(670, 220)" filter="url(#shadow)">
    <rect width="220" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 110 30 C 140 30 160 38 160 45 C 160 52 140 60 110 60 C 80 60 60 52 60 45 C 60 38 80 30 110 30 Z M 60 45 v 45 C 60 97 80 105 110 105 C 140 105 160 97 160 90 v -45 M 60 67 C 60 74 80 82 110 82 C 140 82 160 74 160 67 M 60 89 C 60 96 80 104 110 104 C 140 104 160 96 160 89" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="125" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Docker Named Volume</text>
    <text x="110" y="142" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">postgres_data</text>
  </g>

  <!-- Connections Arrows -->
  <!-- Browser -> Adminer -->
  <path d="M 280 185 L 370 185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="4 4"/>
  
  <!-- NestJS -> Postgres -->
  <path d="M 280 345 L 370 345" stroke="#e0234e" stroke-width="2" marker-end="url(#arrowRed)" stroke-dasharray="4 4"/>

  <!-- Adminer -> Postgres internal network connection -->
  <path d="M 485 280 L 485 300" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Postgres -> Volume -->
  <path d="M 600 365 L 670 295" stroke="#10b981" stroke-width="2" opacity="0.8"/>
  <text x="635" y="320" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="11">mounts</text>
</svg>
