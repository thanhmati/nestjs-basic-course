<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect width="1000" height="460" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    Quản Lý Vòng Đời Kết Nối CSDL Trong NestJS (Prisma Lifecycle Hooks)
  </text>

  <!-- Container Box -->
  <rect x="40" y="65" width="920" height="365" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Step 1: App Bootstrap -->
  <g transform="translate(70, 100)" filter="url(#shadow)">
    <rect width="230" height="130" rx="10" fill="#1e293b" stroke="#e0234e" stroke-width="1.5"/>
    <text x="115" y="32" text-anchor="middle" fill="#e0234e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. NestJS App Startup</text>
    <text x="115" y="58" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">nest start / bootstrap()</text>
    <rect x="15" y="75" width="200" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="97" text-anchor="middle" fill="#e0234e" font-family="JetBrains Mono, monospace" font-size="11">Instantiate PrismaService</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 165 L 360 165" stroke="#e0234e" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="360,160 370,165 360,170" fill="#e0234e"/>

  <!-- Step 2: onModuleInit -->
  <g transform="translate(370, 100)" filter="url(#shadow)">
    <rect width="260" height="130" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="32" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. onModuleInit Hook</text>
    <text x="130" y="58" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">await this.$connect()</text>
    <rect x="20" y="75" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="130" y="97" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="11">Establish DB Pool Connection</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 630 165 L 690 165" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="690,160 700,165 690,170" fill="#34d399"/>

  <!-- Step 3: Runtime Execution -->
  <g transform="translate(700, 100)" filter="url(#shadow)">
    <rect width="230" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="32" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Runtime Execution</text>
    <text x="115" y="58" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">Services / Controllers</text>
    <rect x="15" y="75" width="200" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="97" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">Type-Safe Queries Execution</text>
  </g>

  <!-- Bottom Row: Shutdown & Disconnect -->
  <!-- Arrow 3 -> 4 (Down & Left) -->
  <path d="M 815 230 L 815 280 L 530 280 L 530 300" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <polygon points="525,300 530,310 535,300" fill="#38bdf8"/>

  <!-- Step 4: Graceful Shutdown -->
  <g transform="translate(380, 310)" filter="url(#shadow)">
    <rect width="290" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="145" y="30" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Graceful Shutdown Signal</text>
    <text x="145" y="54" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">SIGINT / SIGTERM / app.close()</text>
    <text x="145" y="76" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Trigger NestJS Shutdown Hooks</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 380 360 L 300 360" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="300,355 290,360 300,365" fill="#ef4444"/>

  <!-- Step 5: onModuleDestroy -->
  <g transform="translate(70, 310)" filter="url(#shadow)">
    <rect width="220" height="100" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">5. onModuleDestroy</text>
    <text x="110" y="54" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">await this.$disconnect()</text>
    <text x="110" y="76" text-anchor="middle" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11">await pool.end()</text>
  </g>
</svg>
