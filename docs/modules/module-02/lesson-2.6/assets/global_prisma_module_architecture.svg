<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect width="1000" height="420" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🌐 Kiến Trúc Đóng Gói @Global() PrismaModule Trong NestJS
  </text>

  <!-- Central Box: @Global() PrismaModule -->
  <g transform="translate(340, 70)" filter="url(#shadow)">
    <rect width="320" height="110" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="15" y="15" width="290" height="30" rx="6" fill="#a855f7" fill-opacity="0.2"/>
    <text x="160" y="35" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">@Global() PrismaModule</text>
    <text x="160" y="68" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="13">providers: [PrismaService]</text>
    <text x="160" y="90" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="13">exports: [PrismaService]</text>
  </g>

  <!-- Lines connecting Central Global Module to Feature Modules -->
  <!-- Left Feature Module: UsersModule -->
  <path d="M 390 180 L 200 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="195,242 205,245 200,235" fill="#a855f7"/>

  <!-- Middle Left Feature Module: AuthModule -->
  <path d="M 460 180 L 400 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="395,242 405,245 402,235" fill="#a855f7"/>

  <!-- Middle Right Feature Module: PostsModule -->
  <path d="M 540 180 L 600 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="598,235 595,245 605,242" fill="#a855f7"/>

  <!-- Right Feature Module: MessagesModule -->
  <path d="M 610 180 L 800 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="798,235 795,245 805,242" fill="#a855f7"/>

  <!-- Feature Modules Row -->
  <!-- 1. UsersModule -->
  <g transform="translate(80, 245)" filter="url(#shadow)">
    <rect width="210" height="130" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="30" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">UsersModule</text>
    <rect x="15" y="45" width="180" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="68" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">UsersService</text>
    <text x="105" y="90" text-anchor="middle" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="10">Inject PrismaService</text>
    <text x="105" y="105" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero re-imports needed!</text>
  </g>

  <!-- 2. AuthModule -->
  <g transform="translate(305, 245)" filter="url(#shadow)">
    <rect width="190" height="130" rx="10" fill="#0f172a" stroke="#e0234e" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#e0234e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">AuthModule</text>
    <rect x="15" y="45" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="68" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">AuthService</text>
    <text x="95" y="90" text-anchor="middle" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="10">Inject PrismaService</text>
    <text x="95" y="105" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero re-imports!</text>
  </g>

  <!-- 3. PostsModule -->
  <g transform="translate(510, 245)" filter="url(#shadow)">
    <rect width="190" height="130" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">PostsModule</text>
    <rect x="15" y="45" width="160" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="68" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">PostsService</text>
    <text x="95" y="90" text-anchor="middle" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="10">Inject PrismaService</text>
    <text x="95" y="105" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero re-imports!</text>
  </g>

  <!-- 4. MessagesModule -->
  <g transform="translate(715, 245)" filter="url(#shadow)">
    <rect width="205" height="130" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="102" y="30" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">MessagesModule</text>
    <rect x="15" y="45" width="175" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="102" y="68" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">MessagesService</text>
    <text x="102" y="90" text-anchor="middle" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="10">Inject PrismaService</text>
    <text x="102" y="105" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero re-imports!</text>
  </g>
</svg>
