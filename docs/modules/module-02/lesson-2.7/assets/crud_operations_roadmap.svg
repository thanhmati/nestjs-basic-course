<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="380" fill="url(#bg)"/>
  <rect width="1000" height="380" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🗺️ Lộ Trình 4 Thao Tác CRUD Chuẩn Hóa Với Prisma Client
  </text>

  <!-- Box 1: CREATE -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect width="200" height="270" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="36" rx="6" fill="#059669"/>
    <text x="100" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">C - CREATE</text>
    
    <text x="25" y="80" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">create()</text>
    <text x="25" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Tạo 1 bản ghi mới</text>

    <text x="25" y="135" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">createMany()</text>
    <text x="25" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Chèn hàng loạt SQL batch</text>

    <text x="25" y="190" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Nested Create</text>
    <text x="25" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Tạo đồng thời User &amp; Profile</text>
  </g>

  <!-- Box 2: READ -->
  <g transform="translate(280, 70)" filter="url(#shadow)">
    <rect width="210" height="270" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="36" rx="6" fill="#0284c7"/>
    <text x="105" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">R - READ</text>

    <text x="25" y="80" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">findUnique / findFirst</text>
    <text x="25" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lọc theo Unique ID / Email</text>

    <text x="25" y="135" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">findMany()</text>
    <text x="25" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lấy danh sách bản ghi</text>

    <text x="25" y="190" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">where / orderBy</text>
    <text x="25" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lọc &amp; Sắp xếp dữ liệu</text>

    <text x="25" y="240" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">skip / take</text>
    <text x="25" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Phân trang Offset</text>
  </g>

  <!-- Box 3: UPDATE -->
  <g transform="translate(520, 70)" filter="url(#shadow)">
    <rect width="210" height="270" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="36" rx="6" fill="#d97706"/>
    <text x="105" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">U - UPDATE</text>

    <text x="25" y="80" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">update()</text>
    <text x="25" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sửa 1 bản ghi theo ID</text>

    <text x="25" y="135" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">updateMany()</text>
    <text x="25" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sửa hàng loạt theo điều kiện</text>

    <text x="25" y="190" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">upsert()</text>
    <text x="25" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Nếu có -> Sửa, Chưa -> Tạo</text>
  </g>

  <!-- Box 4: DELETE -->
  <g transform="translate(760, 70)" filter="url(#shadow)">
    <rect width="190" height="270" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="36" rx="6" fill="#dc2626"/>
    <text x="95" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">D - DELETE</text>

    <text x="25" y="80" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">delete()</text>
    <text x="25" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Xóa 1 bản ghi theo ID</text>

    <text x="25" y="135" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">deleteMany()</text>
    <text x="25" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Xóa hàng loạt theo `where`</text>

    <text x="25" y="190" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Cascade Rules</text>
    <text x="25" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Tự động xóa con liên quan</text>
  </g>
</svg>
