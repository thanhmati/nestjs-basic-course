<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald / Transaction Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Amber / Optimization Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Orbs -->
  <circle cx="200" cy="100" r="150" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Outer Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">
      MODULE 2 • LESSON 2.8 — TRANSACTIONS &amp; OPTIMIZATION
    </text>
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">
    Transactions &amp; Query Optimization
  </text>
  <text x="90" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Xử lý giao dịch dữ liệu an toàn với $transaction &amp; Phòng chống bài toán N+1 Query trong NestJS
  </text>

  <!-- Feature Cards -->
  <!-- Card 1: $transaction API -->
  <g transform="translate(90, 215)" filter="url(#shadow)">
    <rect width="470" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="20" y="25" width="60" height="60" rx="10" fill="url(#emeraldGrad)"/>
    <!-- Shield / Lock Icon -->
    <path d="M 50 40 L 63 46 V 56 C 63 65 57 72 50 75 C 43 72 37 65 37 56 V 46 Z" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
    <text x="95" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ACID $transaction API</text>
    <text x="95" y="75" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500">Sequential &amp; Interactive Transactions</text>
  </g>

  <!-- Card 2: N+1 Prevention -->
  <g transform="translate(600, 215)" filter="url(#shadow)">
    <rect width="470" height="110" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="20" y="25" width="60" height="60" rx="10" fill="url(#amberGrad)"/>
    <!-- Thunderbolt / Speed Icon -->
    <path d="M 52 38 L 40 54 H 50 L 46 68 L 60 50 H 48 Z" fill="#ffffff"/>
    <text x="95" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Prevent N+1 Queries</text>
    <text x="95" y="75" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500">Batching &amp; Eager Loading Strategies</text>
  </g>
</svg>
