<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    🚀 Lộ Trình 4 Bước Thiết Lập Prisma ORM
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#38bdf8"/>
    <text x="35" y="41" text-anchor="middle" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800">1</text>
    <text x="65" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Install Packages</text>
    <rect x="15" y="70" width="160" height="60" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">pnpm add prisma</text>
    <text x="25" y="112" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">@prisma/client ...</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 235 135 L 275 135" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="275,130 285,135 275,140" fill="#64748b"/>

  <!-- Step 2 -->
  <g transform="translate(290, 60)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#818cf8"/>
    <text x="35" y="41" text-anchor="middle" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800">2</text>
    <text x="65" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Init Prisma CLI</text>
    <rect x="15" y="70" width="160" height="60" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="11">prisma init</text>
    <text x="25" y="112" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Creates schema file</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 485 135 L 525 135" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="525,130 535,135 525,140" fill="#64748b"/>

  <!-- Step 3 -->
  <g transform="translate(540, 60)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#c084fc"/>
    <text x="35" y="41" text-anchor="middle" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800">3</text>
    <text x="65" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Config Files</text>
    <rect x="15" y="70" width="160" height="60" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="11">prisma.config.ts</text>
    <text x="25" y="112" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="11">schema.prisma &amp; .env</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 735 135 L 775 135" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="775,130 785,135 775,140" fill="#64748b"/>

  <!-- Step 4 -->
  <g transform="translate(790, 60)" filter="url(#shadow)">
    <rect width="170" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#10b981"/>
    <text x="35" y="41" text-anchor="middle" fill="#0f172a" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800">4</text>
    <text x="65" y="40" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Generate</text>
    <rect x="15" y="70" width="140" height="60" rx="6" fill="#1e293b"/>
    <text x="22" y="92" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="11">prisma generate</text>
    <text x="22" y="112" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Auto Type-Safe API</text>
  </g>
</svg>
