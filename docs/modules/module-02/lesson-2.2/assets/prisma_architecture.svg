<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="prismaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#bg)"/>
  <rect width="1000" height="520" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    Kiến Trúc Hoạt Động Của Prisma ORM
  </text>

  <!-- Container Box -->
  <rect x="50" y="70" width="900" height="420" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="100" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">
    ⚡ Prisma Modern Architecture
  </text>

  <!-- Node 1: Config & Schema -->
  <g transform="translate(80, 130)" filter="url(#shadow)">
    <rect width="230" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="30" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Config &amp; Schema</text>
    <text x="115" y="55" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">prisma.config.ts</text>
    <text x="115" y="75" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="11">prisma/schema.prisma</text>
    <rect x="20" y="88" width="190" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="106" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">provider = "prisma-client"</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 310 195 L 360 195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="360,190 370,195 360,200" fill="#38bdf8"/>

  <!-- Node 2: Prisma CLI & Code Generator -->
  <g transform="translate(370, 130)" filter="url(#shadow)">
    <rect width="250" height="130" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="125" y="35" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Prisma CLI &amp; Generator</text>
    <text x="125" y="60" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">pnpm exec prisma generate</text>
    <rect x="20" y="78" width="210" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="125" y="99" text-anchor="middle" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="11">Generates Type-Safe API</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 620 195 L 670 195" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="670,190 680,195 670,200" fill="#818cf8"/>

  <!-- Node 3: Prisma Client -->
  <g transform="translate(680, 130)" filter="url(#shadow)">
    <rect width="240" height="130" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Prisma Client</text>
    <text x="120" y="55" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">⚡ Type-Safe Database API</text>
    <rect x="20" y="72" width="200" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="120" y="90" text-anchor="middle" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="11">Pure JS/TS Execution</text>
    <text x="120" y="106" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Fast &amp; Autocompleted</text>
  </g>

  <!-- Bottom Row: Driver Adapter & Database -->
  <!-- Arrow Client -> Adapter -->
  <path d="M 800 260 L 800 320 L 520 320 L 520 340" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <polygon points="515,340 520,350 525,340" fill="#c084fc"/>

  <!-- Node 4: Driver Adapter (@prisma/adapter-pg) -->
  <g transform="translate(370, 350)" filter="url(#shadow)">
    <rect width="300" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="35" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Driver Adapter (@prisma/adapter-pg)</text>
    <text x="150" y="60" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Native JS PostgreSQL Driver (pg pool)</text>
    <text x="150" y="85" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Direct connection via Node.js TCP socket</text>
  </g>

  <!-- Arrow Adapter -> Postgres -->
  <path d="M 370 405 L 290 405" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="290,400 280,405 290,410" fill="#f59e0b"/>

  <!-- Node 5: PostgreSQL Database -->
  <g transform="translate(80, 350)" filter="url(#shadow)">
    <rect width="200" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="100" y="40" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">5. PostgreSQL DB</text>
    <text x="100" y="65" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">social_chat_db</text>
    <text x="100" y="88" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Port 5432</text>
  </g>
</svg>
