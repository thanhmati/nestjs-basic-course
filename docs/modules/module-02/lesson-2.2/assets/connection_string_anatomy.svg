<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🔍 Giải Mã Cấu Trúc Connection String DATABASE_URL
  </text>

  <!-- Big Code Card -->
  <g transform="translate(40, 65)" filter="url(#shadow)">
    <rect width="920" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <text x="30" y="42" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">
      <tspan fill="#38bdf8">postgresql://</tspan>
      <tspan fill="#f59e0b">postgres</tspan>
      <tspan fill="#94a3b8">:</tspan>
      <tspan fill="#ef4444">postgres_secret_password</tspan>
      <tspan fill="#94a3b8">@</tspan>
      <tspan fill="#10b981">localhost</tspan>
      <tspan fill="#94a3b8">:</tspan>
      <tspan fill="#60a5fa">5432</tspan>
      <tspan fill="#94a3b8">/</tspan>
      <tspan fill="#c084fc">social_chat_db</tspan>
      <tspan fill="#94a3b8">?</tspan>
      <tspan fill="#f43f5e">schema=public</tspan>
    </text>
  </g>

  <!-- Explanatory Badge Badges -->
  <!-- 1. Protocol -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="130" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="32" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Protocol</text>
    <text x="65" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">postgresql://</text>
  </g>

  <!-- 2. Auth Credentials -->
  <g transform="translate(185, 160)" filter="url(#shadow)">
    <rect width="190" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="32" text-anchor="middle" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">User : Password</text>
    <text x="95" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">postgres : pass</text>
  </g>

  <!-- 3. Host & Port -->
  <g transform="translate(390, 160)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Host : Port</text>
    <text x="90" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">localhost : 5432</text>
  </g>

  <!-- 4. Database Name -->
  <g transform="translate(585, 160)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Database Name</text>
    <text x="90" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">social_chat_db</text>
  </g>

  <!-- 5. DB Schema -->
  <g transform="translate(780, 160)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">DB Schema</text>
    <text x="90" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">schema=public</text>
  </g>
</svg>
