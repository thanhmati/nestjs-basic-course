<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🌲 Phân Cấp Thứ Tự Tạo Dữ Liệu Quan Hệ (FK Dependency Hierarchy)
  </text>

  <!-- Level 1: Core Parent (User) -->
  <g transform="translate(380, 65)" filter="url(#shadow)">
    <rect width="240" height="70" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">LEVEL 1: User Model</text>
    <text x="120" y="52" text-anchor="middle" fill="#f0f9ff" font-family="JetBrains Mono, monospace" font-size="12">Tạo Nguồn Gốc ID Trước</text>
  </g>

  <!-- Down Arrows from Level 1 to Level 2 -->
  <path d="M 430 135 L 260 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="255,175 265,180 262,170" fill="#38bdf8"/>

  <path d="M 570 135 L 740 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="738,170 745,180 735,175" fill="#38bdf8"/>

  <!-- Level 2: Direct Relatives (Profile & Post) -->
  <g transform="translate(140, 180)" filter="url(#shadow)">
    <rect width="240" height="65" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">LEVEL 2: Profile (1-1)</text>
    <text x="120" y="50" text-anchor="middle" fill="#ecfdf5" font-family="JetBrains Mono, monospace" font-size="11">Dùng userId từ User</text>
  </g>

  <g transform="translate(620, 180)" filter="url(#shadow)">
    <rect width="240" height="65" rx="10" fill="#9333ea" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">LEVEL 2: Post (1-N)</text>
    <text x="120" y="50" text-anchor="middle" fill="#faf5ff" font-family="JetBrains Mono, monospace" font-size="11">Dùng authorId từ User</text>
  </g>

  <!-- Down Arrows from Level 2 to Level 3 -->
  <path d="M 740 245 L 740 280" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="735,280 740,290 745,280" fill="#c084fc"/>

  <path d="M 500 135 L 500 280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="495,280 500,290 505,280" fill="#f59e0b"/>

  <!-- Level 3: Leaf Relatives (Comment, Message, Notification) -->
  <g transform="translate(620, 290)" filter="url(#shadow)">
    <rect width="240" height="55" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="120" y="25" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">LEVEL 3: Comment</text>
    <text x="120" y="44" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Dùng postId &amp; authorId</text>
  </g>

  <g transform="translate(380, 290)" filter="url(#shadow)">
    <rect width="220" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="25" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">LEVEL 3: Message</text>
    <text x="110" y="44" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Dùng senderId &amp; receiverId</text>
  </g>

  <g transform="translate(140, 290)" filter="url(#shadow)">
    <rect width="220" height="55" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="25" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">LEVEL 3: Notification</text>
    <text x="110" y="44" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Dùng userId từ User</text>
  </g>
</svg>
