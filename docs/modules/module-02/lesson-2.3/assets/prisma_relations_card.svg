<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    ⚡ Các Loại Quan Hệ (Relations) &amp; Cascade Deletion Rules trong Prisma
  </text>

  <!-- Card 1: 1-1 Relation -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="280" height="250" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#34d399" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#34d399" font-size="20">1:1</text>
    <text x="70" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Quan Hệ 1 - 1</text>

    <rect x="15" y="70" width="250" height="75" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="11">user User @relation(...)</text>
    <text x="25" y="112" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="11">userId Int @unique</text>
    <text x="25" y="130" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">// Chỉ chứa 1 Profile duy nhất</text>

    <text x="15" y="165" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ví dụ: User &lt;-&gt; Profile</text>
    <text x="15" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">⚠️ Bắt buộc có khóa ngoại @unique ở 1 bên để đảm bảo 1-1.</text>
  </g>

  <!-- Card 2: 1-N Relation -->
  <g transform="translate(360, 70)" filter="url(#shadow)">
    <rect width="280" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#38bdf8" font-size="20">1:N</text>
    <text x="70" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Quan Hệ 1 - N</text>

    <rect x="15" y="70" width="250" height="75" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">posts Post[] // ở User</text>
    <text x="25" y="112" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="11">author User @relation(...)</text>
    <text x="25" y="130" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">authorId Int (Không @unique)</text>

    <text x="15" y="165" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ví dụ: User &lt;-&gt; Post, Post &lt;-&gt; Comment</text>
    <text x="15" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Phổ biến nhất trong thực tế.</text>
  </g>

  <!-- Card 3: Cascade Rules -->
  <g transform="translate(680, 70)" filter="url(#shadow)">
    <rect width="280" height="250" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#ef4444" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#ef4444" font-size="20">💥</text>
    <text x="70" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">onDelete: Cascade</text>

    <rect x="15" y="70" width="250" height="75" rx="6" fill="#0f172a"/>
    <text x="25" y="92" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11">@relation(fields: [userId],</text>
    <text x="25" y="112" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11">  references: [id],</text>
    <text x="25" y="130" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11">  onDelete: Cascade)</text>

    <text x="15" y="165" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tự động xóa sạch dữ liệu con</text>
    <text x="15" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tránh lỗi Orphan Records (dữ liệu mồ côi) khi xóa User/Post.</text>
  </g>
</svg>
