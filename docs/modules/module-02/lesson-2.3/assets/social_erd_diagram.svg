<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" fill="url(#bg)"/>
  <rect width="1100" height="580" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    Sơ Đồ ERD Thực Thể Dữ Liệu Ứng Dụng Social Chat App
  </text>

  <!-- Container Box -->
  <rect x="40" y="65" width="1020" height="485" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Model 1: User (Center Core) -->
  <g transform="translate(420, 95)" filter="url(#shadow)">
    <rect width="260" height="190" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#0284c7"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">User (Bảng Người Dùng)</text>
    <text x="15" y="60" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">📧 email: String @unique</text>
    <text x="15" y="104" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">🔒 password: String</text>
    <text x="15" y="126" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">👤 name: String?</text>
    <text x="15" y="148" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 profile: Profile?</text>
    <text x="15" y="168" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 posts: Post[] / comments: Comment[]</text>
  </g>

  <!-- Model 2: Profile (1-1 with User) -->
  <g transform="translate(70, 95)" filter="url(#shadow)">
    <rect width="270" height="170" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="36" rx="10" fill="#059669"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Profile (Hồ Sơ 1-1)</text>
    <text x="15" y="60" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">📝 bio: String?</text>
    <text x="15" y="104" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">🖼️ avatarUrl: String?</text>
    <text x="15" y="130" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 userId: Int @unique (FK)</text>
    <text x="15" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 user: User @relation</text>
  </g>

  <!-- Model 3: Post (1-N with User) -->
  <g transform="translate(760, 95)" filter="url(#shadow)">
    <rect width="260" height="170" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#9333ea"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Post (Bài Viết 1-N)</text>
    <text x="15" y="60" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">📑 title: String</text>
    <text x="15" y="104" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">📄 content: String</text>
    <text x="15" y="130" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 authorId: Int (FK)</text>
    <text x="15" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 author: User / comments: Comment[]</text>
  </g>

  <!-- Model 4: Comment (1-N with Post & User) -->
  <g transform="translate(760, 335)" filter="url(#shadow)">
    <rect width="260" height="170" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#e11d48"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Comment (Bình Luận 1-N)</text>
    <text x="15" y="60" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">💬 content: String</text>
    <text x="15" y="108" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 postId: Int (FK)</text>
    <text x="15" y="130" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 authorId: Int (FK)</text>
    <text x="15" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 post: Post / author: User</text>
  </g>

  <!-- Model 5: Message (Direct Chat 1-N) -->
  <g transform="translate(420, 335)" filter="url(#shadow)">
    <rect width="260" height="170" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#d97706"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Message (Tin Nhắn 1-N)</text>
    <text x="15" y="60" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">✉️ content: String</text>
    <text x="15" y="108" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 senderId: Int (FK)</text>
    <text x="15" y="130" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 receiverId: Int (FK)</text>
    <text x="15" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 sender: User / receiver: User</text>
  </g>

  <!-- Model 6: Notification (1-N) -->
  <g transform="translate(70, 335)" filter="url(#shadow)">
    <rect width="270" height="170" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="36" rx="10" fill="#2563eb"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Notification (Thông Báo 1-N)</text>
    <text x="15" y="60" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="12">🔑 id: Int @id</text>
    <text x="15" y="82" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">🔔 title: String</text>
    <text x="15" y="104" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">👀 isRead: Boolean @default(false)</text>
    <text x="15" y="130" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">📌 userId: Int (FK)</text>
    <text x="15" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">🔗 user: User @relation</text>
  </g>

  <!-- Relationships Arrows -->
  <!-- User <-> Profile (1-1) -->
  <path d="M 420 180 L 340 180" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="380" y="170" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1 : 1</text>

  <!-- User <-> Post (1-N) -->
  <path d="M 680 180 L 760 180" stroke="#c084fc" stroke-width="2.5"/>
  <text x="720" y="170" text-anchor="middle" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1 : N</text>

  <!-- Post <-> Comment (1-N) -->
  <path d="M 890 265 L 890 335" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="915" y="300" text-anchor="middle" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1 : N</text>

  <!-- User <-> Message (1-N) -->
  <path d="M 550 285 L 550 335" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="575" y="315" text-anchor="middle" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1 : N</text>

  <!-- User <-> Notification (1-N) -->
  <path d="M 420 230 L 205 335" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="310" y="270" text-anchor="middle" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1 : N</text>
</svg>
