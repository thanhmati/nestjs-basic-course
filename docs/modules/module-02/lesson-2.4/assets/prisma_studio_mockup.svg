<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg)"/>
  <rect width="1000" height="500" fill="url(#gridPattern)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🖥️ Trực Quan Hóa Dữ Liệu Trực Tiếp Với Prisma Studio (http://localhost:5555)
  </text>

  <!-- Browser Window Frame -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <rect width="920" height="410" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Browser Address Bar Header -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 908 0 A 12 12 0 0 1 920 12 L 920 45 L 0 45 Z" fill="#1e293b"/>
    <circle cx="25" cy="22" r="6" fill="#ef4444"/>
    <circle cx="45" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="22" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="100" y="10" width="720" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="120" y="27" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="12">🔒 http://localhost:5555  (Prisma Studio GUI)</text>
    
    <!-- Sidebar: Model Tabs -->
    <rect x="0" y="45" width="200" height="365" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="75" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">MODELS (6)</text>

    <!-- Model Item Active: User -->
    <rect x="10" y="90" width="180" height="34" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="112" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">👤 User (4)</text>

    <!-- Other Models -->
    <text x="25" y="152" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">📝 Profile (4)</text>
    <text x="25" y="187" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">📄 Post (12)</text>
    <text x="25" y="222" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">💬 Comment (35)</text>
    <text x="25" y="257" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">✉️ Message (80)</text>
    <text x="25" y="292" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">🔔 Notification (15)</text>

    <!-- Main Content Area: Data Table -->
    <!-- Action Bar -->
    <rect x="200" y="45" width="720" height="45" fill="#1e293b"/>
    <rect x="215" y="55" width="110" height="26" rx="5" fill="#10b981"/>
    <text x="235" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+ Add record</text>
    
    <rect x="335" y="55" width="90" height="26" rx="5" fill="#334155"/>
    <text x="355" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Filter (0)</text>

    <rect x="435" y="55" width="90" height="26" rx="5" fill="#334155"/>
    <text x="455" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Sort (0)</text>

    <!-- Table Header -->
    <rect x="200" y="90" width="720" height="32" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="220" y="111" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">id</text>
    <text x="280" y="111" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">email</text>
    <text x="480" y="111" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">name</text>
    <text x="620" y="111" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">role</text>
    <text x="730" y="111" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">posts</text>

    <!-- Table Row 1 -->
    <rect x="200" y="122" width="720" height="36" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="220" y="145" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">1</text>
    <text x="280" y="145" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">admin@chat.com</text>
    <text x="480" y="145" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">System Admin</text>
    <rect x="620" y="132" width="55" height="18" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="632" y="145" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">ADMIN</text>
    <text x="730" y="145" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="12">5 posts -&gt;</text>

    <!-- Table Row 2 -->
    <rect x="200" y="158" width="720" height="36" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="220" y="181" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">2</text>
    <text x="280" y="181" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">john.doe@gmail.com</text>
    <text x="480" y="181" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">John Doe</text>
    <rect x="620" y="168" width="50" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="632" y="181" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">USER</text>
    <text x="730" y="181" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="12">3 posts -&gt;</text>

    <!-- Table Row 3 -->
    <rect x="200" y="194" width="720" height="36" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="220" y="217" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">3</text>
    <text x="280" y="217" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">jane.smith@gmail.com</text>
    <text x="480" y="217" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="12">Jane Smith</text>
    <rect x="620" y="204" width="50" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="632" y="217" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">USER</text>
    <text x="730" y="217" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="12">4 posts -&gt;</text>
  </g>
</svg>
