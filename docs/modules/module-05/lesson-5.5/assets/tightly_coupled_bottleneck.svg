<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="alertCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1c0a0a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="1100" height="480" rx="16" fill="url(#grid)"/>
  <rect width="1100" height="480" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(40, 32)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <circle cx="12" cy="13" r="5" fill="#ef4444"/>
    <text x="25" y="17" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      ANTI-PATTERN ALERT
    </text>

    <!-- Title -->
    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">
      Thảm Họa Nghẽn API Khi Thực Thi Tuần Tự (Monolithic Tight-Coupling)
    </text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Một request đơn lẻ bị kéo dài hơn 2.4 giây do phải chờ đợi hàng loạt dịch vụ phụ trợ bên thứ ba
    </text>
  </g>

  <!-- Flow Content Section -->
  <g transform="translate(40, 125)">
    <!-- 1. Client Card -->
    <g transform="translate(0, 45)" filter="url(#shadow)">
      <rect width="180" height="150" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#blueGrad)"/>
      <rect x="14" y="16" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2"/>
      <!-- Mobile icon -->
      <rect x="24" y="24" width="16" height="20" rx="2" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <circle cx="32" cy="40" r="1" fill="#38bdf8"/>
      <text x="58" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Client User</text>
      <text x="58" y="46" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">POST /comments</text>

      <line x1="14" y1="64" x2="166" y2="64" stroke="#334155" stroke-width="1"/>

      <!-- Waiting Indicator -->
      <g transform="translate(14, 76)">
        <text x="0" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Trạng thái phản hồi:</text>
        <rect x="0" y="22" width="152" height="36" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
        <text x="12" y="44" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">⏳ Đang chờ: 2.43s</text>
      </g>
    </g>

    <!-- Request Arrow to CommentsService -->
    <g transform="translate(185, 115)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4"/>
      <path d="M 40 -5 L 48 0 L 40 5" fill="#f43f5e"/>
      <text x="24" y="-10" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Gọi API</text>
    </g>

    <!-- 2. Overloaded CommentsService Card -->
    <g transform="translate(235, 10)" filter="url(#shadow)">
      <rect width="260" height="220" rx="14" fill="url(#alertCardGrad)" stroke="#ef4444" stroke-width="1.8"/>
      <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#dangerGrad)"/>
      
      <!-- Icon Server Warning -->
      <rect x="16" y="16" width="38" height="38" rx="8" fill="#b91c1c" fill-opacity="0.3"/>
      <path d="M 35 25 L 45 42 L 25 42 Z" stroke="#ef4444" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <line x1="35" y1="32" x2="35" y2="36" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <circle cx="35" cy="39" r="1" fill="#ef4444"/>

      <text x="62" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">CommentsService</text>
      <text x="62" y="47" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11">Quá tải • Vi phạm SRP</text>

      <line x1="16" y1="66" x2="244" y2="66" stroke="#991b1b" stroke-width="1" stroke-opacity="0.6"/>

      <!-- Dependency Tags -->
      <text x="16" y="86" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
        Inject 4 Services đồng thời:
      </text>

      <g transform="translate(16, 96)">
        <rect x="0" y="0" width="108" height="22" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="6" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">PrismaService</text>

        <rect x="114" y="0" width="114" height="22" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="120" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">NotificationSvc</text>

        <rect x="0" y="28" width="108" height="22" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
        <text x="6" y="43" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5">MailService ⚠️</text>

        <rect x="114" y="28" width="114" height="22" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="120" y="43" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="9.5">FcmPushService</text>
      </g>

      <rect x="16" y="174" width="228" height="30" rx="6" fill="#7f1d1d" fill-opacity="0.5"/>
      <text x="24" y="193" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
        💥 Nguy cơ: Circular Dependency!
      </text>
    </g>

    <!-- Connector Lines to Sequential Tasks -->
    <g transform="translate(500, 120)">
      <!-- Line 1 -->
      <path d="M 0 0 C 20 0, 30 -90, 50 -90" stroke="#10b981" stroke-width="1.8" fill="none"/>
      <!-- Line 2 -->
      <path d="M 0 0 C 20 0, 30 -45, 50 -45" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <!-- Line 3 -->
      <path d="M 0 0 L 50 0" stroke="#ef4444" stroke-width="2.5" fill="none"/>
      <!-- Line 4 -->
      <path d="M 0 0 C 20 0, 30 45, 50 45" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
      <!-- Line 5 -->
      <path d="M 0 0 C 20 0, 30 90, 50 90" stroke="#a855f7" stroke-width="1.8" fill="none"/>
    </g>

    <!-- 3. Sequential Tasks List (Right Side) -->
    <g transform="translate(555, 0)">
      <!-- Task 1: DB Save -->
      <g transform="translate(0, 10)" filter="url(#shadow)">
        <rect width="465" height="40" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#10b981"/>
        <text x="34" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
          1. Lưu bình luận vào PostgreSQL (Prisma)
        </text>
        <rect x="385" y="9" width="68" height="22" rx="5" fill="#064e3b"/>
        <text x="419" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">50ms ✓</text>
      </g>

      <!-- Task 2: Notification DB -->
      <g transform="translate(0, 55)" filter="url(#shadow)">
        <rect width="465" height="40" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#38bdf8"/>
        <text x="34" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
          2. Tạo bản ghi Notification cho chủ bài viết
        </text>
        <rect x="385" y="9" width="68" height="22" rx="5" fill="#0c4a6e"/>
        <text x="419" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">50ms ✓</text>
      </g>

      <!-- Task 3: SendGrid Email (Bottleneck & Crash Point) -->
      <g transform="translate(0, 100)" filter="url(#shadow)">
        <rect width="465" height="42" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
        <circle cx="20" cy="21" r="5" fill="#ef4444"/>
        <text x="34" y="25" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
          3. Gửi Email thông báo qua SendGrid (Mạng ngoài)
        </text>
        <rect x="365" y="9" width="88" height="24" rx="5" fill="#7f1d1d"/>
        <text x="409" y="25" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">1,500ms 💥</text>
      </g>

      <!-- Task 4: FCM Push -->
      <g transform="translate(0, 147)" filter="url(#shadow)">
        <rect width="465" height="40" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#f59e0b"/>
        <text x="34" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
          4. Bắn Push Notification qua Firebase FCM
        </text>
        <rect x="385" y="9" width="68" height="22" rx="5" fill="#78350f"/>
        <text x="419" y="24" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">800ms ⏳</text>
      </g>

      <!-- Task 5: Reputation Points -->
      <g transform="translate(0, 192)" filter="url(#shadow)">
        <rect width="465" height="40" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#a855f7"/>
        <text x="34" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
          5. Cộng điểm thưởng uy tín người dùng
        </text>
        <rect x="385" y="9" width="68" height="22" rx="5" fill="#581c87"/>
        <text x="419" y="24" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">30ms ⏳</text>
      </g>
    </g>
  </g>

  <!-- Bottom Alert Bar (Cascading Failure Warning) -->
  <g transform="translate(40, 395)" filter="url(#shadow)">
    <rect width="1020" height="60" rx="10" fill="#2a0808" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="60" rx="3" fill="#ef4444"/>

    <g transform="translate(20, 18)">
      <circle cx="12" cy="12" r="12" fill="#ef4444" fill-opacity="0.2"/>
      <text x="12" y="17" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" text-anchor="middle">!</text>
      
      <text x="34" y="10" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        Hậu Quả: Lỗi Dây Chuyền (Cascading Failure) &amp; Trải Nghiệm Người Dùng Tồi Tệ
      </text>
      <text x="34" y="28" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Nếu SendGrid gặp sự cố hoặc timeout ➔ Toàn bộ request POST /comments bị văng ngoại lệ (500 Error) ➔ Mất bình luận của người dùng!
      </text>
    </g>
  </g>
</svg>
