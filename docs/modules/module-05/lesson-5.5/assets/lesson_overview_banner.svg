<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e0234e"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="150" cy="80" r="160" fill="#e0234e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="320" r="180" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="140" fill="#7e22ce" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Header Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#e0234e"/>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      NESTJS PRACTICAL • MODULE 05 • LESSON 5.5
    </text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Event-Driven Architecture Với @nestjs/event-emitter
    </text>
    <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Tách Rời Nghiệp Vụ • Bắn Sự Kiện comment.created • Tự Động Tạo Notification &amp; Chuẩn Bị Cho WebSockets
    </text>
  </g>

  <!-- Pipeline Cards Row -->
  <g transform="translate(60, 185)">
    <!-- Step 1 Card: Event Publisher -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#nestGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#e0234e" fill-opacity="0.15"/>
      <!-- Icon: Signal / Broadcast / Event -->
      <circle cx="37" cy="39" r="3" fill="#f43f5e"/>
      <path d="M 31 33 A 9 9 0 0 1 43 33" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 27 28 A 15 15 0 0 1 47 28" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Event Publisher</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">CommentsService</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• eventEmitter.emit()</tspan>
        <tspan x="18" dy="20">• Đóng gói CommentCreatedEvent</tspan>
        <tspan x="18" dy="20">• Không nghẽn luồng tạo comment</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#e0234e" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#fb7185" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Event Emission</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(253, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 2 Card: In-Process Event Bus -->
    <g transform="translate(280, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#blueGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.15"/>
      <!-- Icon: Event Bus / Lightning / Connection -->
      <path d="M 37 26 L 31 37 L 38 37 L 35 48 L 44 36 L 37 36 Z" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. In-Process Bus</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">EventEmitter2 Core</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• EventEmitterModule.forRoot()</tspan>
        <tspan x="18" dy="20">• Triệt tiêu Circular Dependency</tspan>
        <tspan x="18" dy="20">• Pub/Sub Pattern phân tán</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#0284c7" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Decoupled Bus</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(533, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 3 Card: Smart Listener -->
    <g transform="translate(560, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#secGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#059669" fill-opacity="0.15"/>
      <!-- Icon: Filter / Filter Shield -->
      <path d="M 28 30 L 46 30 L 39 39 L 39 46 L 35 48 L 35 39 Z" stroke="#34d399" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Smart Listener</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">@OnEvent('comment.*')</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Lắng nghe sự kiện độc lập</tspan>
        <tspan x="18" dy="20">• Lọc tự tương tác (Self-comment)</tspan>
        <tspan x="18" dy="20">• Xử lý lỗi không ảnh hưởng main</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#059669" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Smart Filter</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(813, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 4 Card: Persistence & WebSockets Bridge -->
    <g transform="translate(840, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#purpleGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#7e22ce" fill-opacity="0.15"/>
      <!-- Icon: Bell Notification -->
      <path d="M 37 27 A 6 6 0 0 0 31 33 C 31 39 28 41 28 41 L 46 41 C 46 41 43 39 43 33 A 6 6 0 0 0 37 27 Z" stroke="#c084fc" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M 35 44 A 2.5 2.5 0 0 0 39 44" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Notification &amp; WS</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">DB Persist &amp; Real-time</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Lưu Notification vào PostgreSQL</tspan>
        <tspan x="18" dy="20">• API đọc/đánh dấu đã đọc</tspan>
        <tspan x="18" dy="20">• Cầu nối WebSockets Module 6</tspan>
      </text>
      <rect x="18" y="136" width="120" height="22" rx="6" fill="#7e22ce" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#c084fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Enterprise Ready</text>
    </g>
  </g>
</svg>
