<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Terminal Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">
      nest-app // social-chat-backend // src/posts/
    </text>

    <!-- Header Text -->
    <text x="80" y="125" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      LESSON 5.1: POSTS API — CRUD &amp; PAGINATION
    </text>
    <text x="80" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">
      Triển khai CRUD bài viết và phân tích kỹ thuật Offset-based vs Cursor-based Pagination trong NestJS &amp; Prisma ORM
    </text>
  </g>

  <!-- Left Inner Box: CRUD Endpoints -->
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="310" height="165" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="195" fill="#6366f1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">
      ⚡ CRUD REST ENDPOINTS
    </text>

    <!-- Method Badges -->
    <!-- POST -->
    <rect x="100" y="210" width="55" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="127" y="224" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST</text>
    <text x="168" y="224" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/posts</text>

    <!-- GET -->
    <rect x="100" y="238" width="55" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="127" y="252" text-anchor="middle" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="168" y="252" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/posts?page=1</text>

    <!-- PATCH -->
    <rect x="100" y="266" width="55" height="20" rx="4" fill="#f59e0b" opacity="0.2"/>
    <text x="127" y="280" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PATCH</text>
    <text x="168" y="280" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/posts/:id</text>

    <!-- DELETE -->
    <rect x="100" y="294" width="55" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="127" y="308" text-anchor="middle" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DELETE</text>
    <text x="168" y="308" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/posts/:id</text>
  </g>

  <!-- Center Box: Offset Pagination -->
  <g filter="url(#shadow)">
    <rect x="410" y="170" width="345" height="165" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="195" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">
      📑 OFFSET-BASED (PAGE / LIMIT)
    </text>

    <!-- Graphic offset bars -->
    <rect x="430" y="212" width="305" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="442" y="230" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SQL: OFFSET 100000 LIMIT 10</text>

    <path d="M 430 252 L 735 252" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Pros & Cons -->
    <text x="430" y="275" fill="#ef4444" font-family="'Inter', sans-serif" font-size="11" font-weight="600">❌ Nhược điểm:</text>
    <text x="525" y="275" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Chậm khi dataset lớn (Scan lại B-Tree)</text>
    
    <text x="430" y="295" fill="#ef4444" font-family="'Inter', sans-serif" font-size="11" font-weight="600">❌ Data Drift:</text>
    <text x="525" y="295" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Bị trùng/bỏ sót bài viết khi feed thêm mới</text>

    <text x="430" y="318" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✔️ Phù hợp:</text>
    <text x="525" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Trang Admin, Dashboard (Jump to Page N)</text>
  </g>

  <!-- Right Box: Cursor Pagination -->
  <g filter="url(#shadow)">
    <rect x="775" y="170" width="345" height="165" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="775" y="170" width="345" height="24" rx="10" fill="url(#cyanGrad)" opacity="0.15"/>

    <text x="795" y="195" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">
      🚀 CURSOR-BASED (INFINITE SCROLL)
    </text>

    <!-- Graphic cursor bar -->
    <rect x="795" y="212" width="305" height="28" rx="6" fill="#1e293b" stroke="#0891b2" stroke-width="1"/>
    <text x="807" y="230" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Prisma: cursor: { id: 105 }, take: 10</text>

    <path d="M 795 252 L 1100 252" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Pros & Cons -->
    <text x="795" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">⚡ Tốc độ:</text>
    <text x="870" y="275" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Siêu nhanh O(1) nhờ Index Seek (id/createdAt)</text>
    
    <text x="795" y="295" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">🛡️ Vẫn nhất quán:</text>
    <text x="870" y="295" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Không bị trôi dữ liệu khi new post xuất hiện</text>

    <text x="795" y="318" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">🎯 Phù hợp:</text>
    <text x="870" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Social Newsfeed, Real-time Chat Feed</text>
  </g>
</svg>
