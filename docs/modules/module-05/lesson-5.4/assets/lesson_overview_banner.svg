<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e0234e"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="150" cy="80" r="160" fill="#e0234e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="320" r="180" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="140" fill="#059669" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Header Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#e0234e"/>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      NESTJS PRACTICAL • MODULE 05 • LESSON 5.4
    </text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Comments API: Kiến Trúc RESTful &amp; Phân Quyền Bình Luận
    </text>
    <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Nested Resources (/posts/:id/comments) • Ma Trận Phân Quyền Tác Giả &amp; Chủ Bài Viết • Quan Hệ 1-N &amp; Phân Trang
    </text>
  </g>

  <!-- Pipeline Cards Row -->
  <g transform="translate(60, 185)">
    <!-- Step 1 Card: Nested Routing -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#nestGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#e0234e" fill-opacity="0.15"/>
      <!-- Icon: Chat bubble comment -->
      <path d="M 28 32 C 28 28.7 30.7 26 34 26 L 44 26 C 47.3 26 50 28.7 50 32 L 50 40 C 50 43.3 47.3 46 44 46 L 35 46 L 29 51 L 29 46 C 28.4 46 28 45.6 28 45 Z" stroke="#f43f5e" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Nested Routes</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">/posts/:id/comments</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Chuẩn RESTful cha - con</tspan>
        <tspan x="18" dy="20">• ParseIntPipe postId tự động</tspan>
        <tspan x="18" dy="20">• Phẳng hóa PATCH/DELETE /:id</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#e0234e" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#fb7185" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">RESTful Hierarchy</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(253, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 2 Card: Data Integrity -->
    <g transform="translate(280, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#blueGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.15"/>
      <!-- Icon: Database relation -->
      <ellipse cx="37" cy="31" rx="10" ry="3.5" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <path d="M 27 31 v 14 c 0 2 4.5 3.5 10 3.5 s 10 -1.5 10 -3.5 v -14" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Data Integrity</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Prisma 1-N &amp; FK</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Bắt lỗi 404 khi post không có</tspan>
        <tspan x="18" dy="20">• Khóa ngoại authorId, postId</tspan>
        <tspan x="18" dy="20">• Cascade dọn comment theo post</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#0284c7" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Foreign Keys</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(533, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 3 Card: Authorization Matrix -->
    <g transform="translate(560, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#secGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#059669" fill-opacity="0.15"/>
      <!-- Icon: Shield check -->
      <path d="M 37 27 L 47 31 L 47 40 C 47 46 37 50 37 50 C 37 50 27 46 27 40 L 27 31 Z" stroke="#34d399" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M 32 38 L 35 41 L 42 34" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Access Matrix</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Ownership Rules</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Sửa: Duy nhất Comment Author</tspan>
        <tspan x="18" dy="20">• Xóa: Author HOẶC Post Owner</tspan>
        <tspan x="18" dy="20">• Chặn 403 Forbidden chuẩn mực</tspan>
      </text>
      <rect x="18" y="136" width="115" height="22" rx="6" fill="#059669" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Strict Ownership</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(813, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 4 Card: Query & Include Profile -->
    <g transform="translate(840, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#purpleGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#7e22ce" fill-opacity="0.15"/>
      <!-- Icon: List / User Profile Include -->
      <rect x="27" y="28" width="20" height="18" rx="3" stroke="#c084fc" stroke-width="1.8" fill="none"/>
      <line x1="32" y1="34" x2="42" y2="34" stroke="#c084fc" stroke-width="1.5"/>
      <line x1="32" y1="38" x2="39" y2="38" stroke="#c084fc" stroke-width="1.5"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Query &amp; Profile</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Pagination + Include</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Phân trang page, limit, order</tspan>
        <tspan x="18" dy="20">• Include Author Profile Avatar</tspan>
        <tspan x="18" dy="20">• Đóng gói TransformInterceptor</tspan>
      </text>
      <rect x="18" y="136" width="115" height="22" rx="6" fill="#7e22ce" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#c084fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Author &amp; Avatar</text>
    </g>
  </g>
</svg>
