<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e0234e"/>
    </linearGradient>

    <linearGradient id="multerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="150" cy="80" r="160" fill="#e0234e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="320" r="180" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="140" fill="#059669" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Header Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="6" fill="#e0234e"/>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      NESTJS PRACTICAL • MODULE 05 • LESSON 5.3
    </text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      File Upload &amp; Storage Architecture Với Multer
    </text>
    <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Tải Lên Ảnh Đại Diện / Bài Viết • Pipeline Kiểm Duyệt An Toàn • Tích Hợp Swagger &amp; Static Serving
    </text>
  </g>

  <!-- Pipeline Cards Row -->
  <g transform="translate(60, 185)">
    <!-- Step 1 Card: Multipart Stream -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#nestGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#e0234e" fill-opacity="0.15"/>
      <path d="M 28 39 L 37 30 L 46 39 M 37 30 L 37 48" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Client Request</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">multipart/form-data</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" line-height="1.5">
        <tspan x="18" dy="0">• Gửi file nhị phân qua boundary</tspan>
        <tspan x="18" dy="20">• FileInterceptor('avatar')</tspan>
        <tspan x="18" dy="20">• Hỗ trợ Single &amp; Multiple files</tspan>
      </text>
      <rect x="18" y="136" width="95" height="22" rx="6" fill="#e0234e" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#fb7185" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Multer Stream</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(253, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 2 Card: Validation Pipeline -->
    <g transform="translate(280, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#secGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#059669" fill-opacity="0.15"/>
      <path d="M 37 28 L 47 32 L 47 41 C 47 47 37 51 37 51 C 37 51 27 47 27 41 L 27 32 Z" stroke="#34d399" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M 33 39 L 36 42 L 42 36" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Security Gate</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">ParseFilePipe Guard</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• MaxFileSizeValidator (2MB)</tspan>
        <tspan x="18" dy="20">• FileTypeValidator (JPEG/PNG/WEBP)</tspan>
        <tspan x="18" dy="20">• Chống mã độc RCE &amp; DoS</tspan>
      </text>
      <rect x="18" y="136" width="95" height="22" rx="6" fill="#059669" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Strict Validation</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(533, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 3 Card: Storage Engine -->
    <g transform="translate(560, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#multerGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.15"/>
      <rect x="27" y="30" width="20" height="18" rx="3" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <line x1="27" y1="36" x2="47" y2="36" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="1.5" fill="#38bdf8"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Storage Engine</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">diskStorage / Memory</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• UUIDv4 + Timestamp Unique</tspan>
        <tspan x="18" dy="20">• Sanitize path traversal (../)</tspan>
        <tspan x="18" dy="20">• Lưu uploads/avatars/ disk</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#0284c7" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Safe Filename</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(813, 75)">
      <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Step 4 Card: Serving & Database -->
    <g transform="translate(840, 0)" filter="url(#dropShadow)">
      <rect width="245" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#purpleGrad)"/>
      <rect x="18" y="20" width="38" height="38" rx="10" fill="#7e22ce" fill-opacity="0.15"/>
      <ellipse cx="37" cy="32" rx="10" ry="4" stroke="#c084fc" stroke-width="1.8" fill="none"/>
      <path d="M 27 32 v 14 c 0 2.2 4.5 4 10 4 s 10 -1.8 10 -4 v -14" stroke="#c084fc" stroke-width="1.8" fill="none"/>
      <path d="M 27 39 c 0 2.2 4.5 4 10 4 s 10 -1.8 10 -4" stroke="#c084fc" stroke-width="1.8" fill="none"/>
      <text x="66" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">4. Serve &amp; Persist</text>
      <text x="66" y="52" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Static URL + Prisma</text>
      <text x="18" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan x="18" dy="0">• Cập nhật Profile.avatarUrl</tspan>
        <tspan x="18" dy="20">• useStaticAssets('/uploads')</tspan>
        <tspan x="18" dy="20">• Trả về Enterprise JSON URL</tspan>
      </text>
      <rect x="18" y="136" width="105" height="22" rx="6" fill="#7e22ce" fill-opacity="0.15"/>
      <text x="26" y="151" fill="#c084fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">Static Serving</text>
    </g>
  </g>
</svg>
