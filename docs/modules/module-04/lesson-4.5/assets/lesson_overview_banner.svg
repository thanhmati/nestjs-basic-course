<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Amber / Throttler Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Red / Blocked Accent -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#ef4444" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 4.5: API Rate Limiting &amp; Anti-Spam Protection (@nestjs/throttler)
    </text>
  </g>

  <!-- 1. Rapid Request Burst Node -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="250" height="210" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="250" height="32" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      💥 RAPID REQUEST BURST (SPAM)
    </text>
    <text x="15" y="55" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11">
      POST /api/v1/auth/login
    </text>
    <text x="15" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      Client IP: 192.168.1.50
    </text>

    <rect x="15" y="95" width="220" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="115" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">Req #1: 10:00:01 (Pass)</text>
    <text x="23" y="132" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">Req #2-#5: 10:00:02 (Pass)</text>
    <text x="23" y="150" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Req #6+: 10:00:03 (BLOCKED!)</text>
    <text x="23" y="172" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Limit: 5 reqs / 60 seconds</text>
  </g>

  <!-- Arrow 1: Request -> ThrottlerGuard -->
  <g transform="translate(330, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#f59e0b"/>
  </g>

  <!-- 2. NestJS ThrottlerGuard Node -->
  <g transform="translate(395, 110)" filter="url(#shadow)">
    <rect width="370" height="220" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="370" height="32" rx="12" fill="#b45309" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      ⚡ THROTTLER GUARD &amp; SLIDING WINDOW
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      ThrottlerModule.forRoot([{ ttl: 60000, limit: 5 }])
    </text>
    <text x="15" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      1. Track Request count by IP + Route Key
    </text>
    <text x="15" y="101" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      2. Check: reqCount &lt;= limit
    </text>
    <text x="15" y="124" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">
      3. Set Response Headers: X-RateLimit-*
    </text>

    <!-- Sub-cards: Throttle vs SkipThrottle -->
    <rect x="15" y="142" width="165" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="162" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">@Throttle({ ... })</text>
    <text x="23" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Thắt chặt API nhạy cảm</text>

    <rect x="190" y="142" width="165" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="198" y="162" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">@SkipThrottle()</text>
    <text x="198" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Bỏ qua giới hạn Rate Limit</text>
  </g>

  <!-- Arrow 2: Throttler -> 429 Response -->
  <g transform="translate(765, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#ef4444" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#ef4444"/>
  </g>

  <!-- 3. 429 Too Many Requests Response Node -->
  <g transform="translate(830, 115)" filter="url(#shadow)">
    <rect width="290" height="210" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="290" height="32" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🔴 429 TOO MANY REQUESTS
    </text>
    
    <rect x="15" y="48" width="260" height="145" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="68" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">HTTP/1.1 429 Too Many Requests</text>
    <text x="23" y="86" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">X-RateLimit-Limit: 5</text>
    <text x="23" y="101" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">X-RateLimit-Remaining: 0</text>
    <text x="23" y="116" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Retry-After: 57</text>
    <text x="23" y="138" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9">"message": "Bạn đã gửi quá nhiều"</text>
    <text x="23" y="153" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9">"yêu cầu. Thử lại sau 57s!"</text>
  </g>
</svg>
