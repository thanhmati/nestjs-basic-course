<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Google Gradient -->
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="30%" stop-color="#ea4335"/>
      <stop offset="70%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>

    <linearGradient id="passportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="220" cy="140" r="140" fill="#4285f4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="960" cy="240" r="150" fill="#34a853" opacity="0.12" filter="url(#glow)"/>
  <circle cx="620" cy="180" r="100" fill="#ea4335" opacity="0.08" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="35" width="1100" height="330" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M 50 51 A 16 16 0 0 1 66 35 L 1134 35 A 16 16 0 0 1 1150 51 L 1150 78 L 50 78 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="56" r="6" fill="#ef4444"/>
    <circle cx="100" cy="56" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="56" r="6" fill="#10b981"/>
    <text x="145" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">docs/modules/module-04/lesson-4.5 — Google OAuth2 Social Login</text>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(90, 115)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#e0234e" fill-opacity="0.2" stroke="#e0234e" stroke-width="1"/>
    <text x="52" y="17" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">MODULE 04</text>

    <rect x="115" y="0" width="110" height="26" rx="6" fill="#4285f4" fill-opacity="0.2" stroke="#4285f4" stroke-width="1"/>
    <text x="170" y="17" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">LESSON 4.5</text>

    <rect x="235" y="0" width="130" height="26" rx="6" fill="#34a853" fill-opacity="0.2" stroke="#34a853" stroke-width="1"/>
    <text x="300" y="17" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">GOOGLE OAUTH2</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">
      Google OAuth2 Social Login
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
      Đăng nhập mạng xã hội &amp; Kiến trúc Đa Chiến Lược (<tspan fill="#60a5fa" font-weight="600">passport-google-oauth20</tspan>)
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 130)">
      <circle cx="6" cy="6" r="4" fill="#4285f4"/>
      <text x="20" y="10" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Strategy Pattern: Cắm thêm Google không phá vỡ JWT</text>

      <circle cx="6" cy="34" r="4" fill="#ea4335"/>
      <text x="20" y="38" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Authorization Code Flow: Chuyển hướng &amp; Callback bảo mật</text>

      <circle cx="6" cy="62" r="4" fill="#34a853"/>
      <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Upsert User DB &amp; Phát hành Access Token đồng bộ hệ thống</text>
    </g>
  </g>

  <!-- Right Visual Flow Diagram -->
  <g transform="translate(595, 105)">
    <!-- Step 1: Redirect -->
    <g filter="url(#shadow)">
      <rect x="0" y="15" width="145" height="90" rx="10" fill="#1e293b" stroke="#4285f4" stroke-width="1.5"/>
      <rect x="0" y="15" width="145" height="24" rx="10" fill="#1d4ed8"/>
      <text x="72" y="31" fill="#bfdbfe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🌐 GET /auth/google</text>
      <text x="72" y="58" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AuthGuard('google')</text>
      <text x="72" y="74" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">➔ Redirect Google</text>
      <text x="72" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">User đồng ý cấp quyền</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 150 60 L 175 60" stroke="#4285f4" stroke-width="2"/>
    <polygon points="178,60 172,56 172,64" fill="#4285f4"/>

    <!-- Step 2: Callback & Strategy -->
    <g filter="url(#shadow)">
      <rect x="182" y="0" width="186" height="120" rx="12" fill="#0f172a" stroke="#ea4335" stroke-width="1.8"/>
      <rect x="182" y="0" width="186" height="26" rx="12" fill="#7f1d1d" fill-opacity="0.5"/>
      <text x="275" y="18" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">⚡ /callback &amp; Strategy</text>

      <text x="192" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">1. Google trả 'code'</text>
      <text x="192" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">2. Trao đổi lấy Profile</text>
      <line x1="192" y1="70" x2="358" y2="70" stroke="#334155" stroke-width="1"/>
      <text x="192" y="86" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">GoogleStrategy.validate</text>
      <text x="192" y="104" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">➔ email, name, picture</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 372 60 L 397 60" stroke="#34a853" stroke-width="2"/>
    <polygon points="400,60 394,56 394,64" fill="#34a853"/>

    <!-- Step 3: AuthService & JWT Issue -->
    <g filter="url(#shadow)">
      <rect x="403" y="15" width="142" height="90" rx="10" fill="#064e3b" stroke="#34a853" stroke-width="1.5"/>
      <rect x="403" y="15" width="142" height="24" rx="10" fill="#065f46"/>
      <text x="474" y="31" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🚀 Issue App JWT</text>
      <text x="474" y="58" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">socialLogin(user)</text>
      <text x="474" y="73" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">{ accessToken }</text>
      <text x="474" y="92" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">🟢 Đăng nhập thành công</text>
    </g>

    <!-- Bottom note badge -->
    <rect x="0" y="145" width="545" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="272" y="170" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
      ✨ <tspan fill="#ffffff" font-weight="bold">Passport</tspan> chuẩn hóa OAuth2: Controller chỉ nhận <tspan fill="#34d399" font-weight="bold">req.user</tspan> sạch sẽ &amp; đồng bộ
    </text>
  </g>
</svg>
