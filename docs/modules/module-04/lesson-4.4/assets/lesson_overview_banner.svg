<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald / Public Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan / User Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 4.4: NestJS Custom Decorators (@CurrentUser() Param Decorator &amp; @Public() Reflector Metadata)
    </text>
  </g>

  <!-- 1. @Public() Route Decorator Node -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="490" height="210" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="490" height="32" rx="12" fill="#047857" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🔓 1. CUSTOM ROUTE DECORATOR: @Public()
    </text>
    
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      export const Public = () => SetMetadata(IS_PUBLIC_KEY, true);
    </text>

    <!-- Code Snippet inside -->
    <rect x="15" y="70" width="460" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="90" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">@Public()</text>
    <text x="23" y="108" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">@Post('login')</text>
    <text x="23" y="126" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">login(@Body() dto: LoginDto) { ... }</text>

    <text x="15" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Global Guard dùng Reflector đọc metadata ➔ Bypass kiểm tra JWT Token!
    </text>
  </g>

  <!-- 2. @CurrentUser() Param Decorator Node -->
  <g transform="translate(630, 115)" filter="url(#shadow)">
    <rect width="490" height="210" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="490" height="32" rx="12" fill="#0e7490" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#a5f3fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      👤 2. CUSTOM PARAM DECORATOR: @CurrentUser()
    </text>
    
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      createParamDecorator((data, ctx) => ctx.switchToHttp().getRequest().user)
    </text>

    <!-- Code Snippet inside -->
    <rect x="15" y="70" width="460" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="90" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">@Get('profile')</text>
    <text x="23" y="108" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10">getProfile(@CurrentUser() user: JwtPayload) {</text>
    <text x="35" y="126" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">return user; // Clean, Type-Safe &amp; No req: any!</text>
    <text x="23" y="144" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10">}</text>

    <text x="15" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Trích xuất req.user gọn gàng, hỗ trợ truyền key: @CurrentUser('userId')
    </text>
  </g>
</svg>
