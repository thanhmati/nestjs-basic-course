<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="passportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="220" cy="140" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="960" cy="240" r="150" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="620" cy="180" r="100" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="35" width="1100" height="330" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M 50 51 A 16 16 0 0 1 66 35 L 1134 35 A 16 16 0 0 1 1150 51 L 1150 78 L 50 78 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="56" r="6" fill="#ef4444"/>
    <circle cx="100" cy="56" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="56" r="6" fill="#10b981"/>
    <text x="145" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">docs/modules/module-04/lesson-4.4 — Passport.js &amp; JwtStrategy</text>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(90, 115)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#e0234e" fill-opacity="0.2" stroke="#e0234e" stroke-width="1"/>
    <text x="55" y="17" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">MODULE 04</text>

    <rect x="120" y="0" width="130" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="185" y="17" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">LESSON 4.4</text>

    <rect x="260" y="0" width="165" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="342" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">STRATEGY PATTERN</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
      Passport.js &amp; JwtStrategy
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
      Chuẩn hóa xác thực đa chiến lược với <tspan fill="#60a5fa" font-weight="600">@nestjs/passport</tspan>
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 130)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="20" y="10" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Strategy Pattern: Độc lập cơ chế xác thực</text>

      <circle cx="6" cy="34" r="4" fill="#f59e0b"/>
      <text x="20" y="38" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">ExtractJwt &amp; Tự động gán req.user từ validate()</text>

      <circle cx="6" cy="62" r="4" fill="#10b981"/>
      <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Tùy biến JwtAuthGuard xử lý TokenExpiredError</text>
    </g>
  </g>

  <!-- Right Visual Flow Diagram -->
  <g transform="translate(600, 105)">
    <!-- Step 1: Guard -->
    <g filter="url(#shadow)">
      <rect x="0" y="15" width="140" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="15" width="140" height="24" rx="10" fill="#1e3a8a"/>
      <text x="70" y="31" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🛡️ JwtAuthGuard</text>
      <text x="70" y="58" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">extends</text>
      <text x="70" y="73" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">AuthGuard('jwt')</text>
      <text x="70" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">handleRequest()</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 145 60 L 175 60" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="178,60 172,56 172,64" fill="#3b82f6"/>

    <!-- Step 2: Strategy (Passport) -->
    <g filter="url(#shadow)">
      <rect x="185" y="0" width="180" height="120" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
      <rect x="185" y="0" width="180" height="26" rx="12" fill="#78350f" fill-opacity="0.5"/>
      <text x="275" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">🔑 JwtStrategy</text>

      <text x="195" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">1. ExtractJwt Bearer</text>
      <text x="195" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">2. Verify JWT_SECRET</text>
      <line x1="195" y1="70" x2="355" y2="70" stroke="#334155" stroke-width="1"/>
      <text x="195" y="86" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">validate(payload)</text>
      <text x="195" y="104" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9">➔ Auto inject req.user</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 370 60 L 400 60" stroke="#10b981" stroke-width="2"/>
    <polygon points="403,60 397,56 397,64" fill="#10b981"/>

    <!-- Step 3: Controller -->
    <g filter="url(#shadow)">
      <rect x="408" y="15" width="115" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="408" y="15" width="115" height="24" rx="10" fill="#065f46"/>
      <text x="465" y="31" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">📄 Controller</text>
      <text x="465" y="58" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">req.user</text>
      <text x="465" y="73" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">{ userId, email }</text>
      <text x="465" y="92" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">🟢 200 OK</text>
    </g>

    <!-- Bottom note badge -->
    <rect x="0" y="145" width="525" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="262" y="170" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
      ✨ <tspan fill="#ffffff" font-weight="bold">Passport</tspan> tự động kết nối <tspan fill="#fbbf24" font-weight="bold">JwtStrategy.validate()</tspan> với <tspan fill="#34d399" font-weight="bold">req.user</tspan> chuẩn xác
    </text>
  </g>
</svg>
