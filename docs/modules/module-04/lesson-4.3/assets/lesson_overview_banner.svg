<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Guard Accent (Emerald / Green) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Red / Blocked Accent -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 4.3: API Guard Protection (JwtAuthGuard &amp; Passport Strategy Verification)
    </text>
  </g>

  <!-- 1. Incoming Request with Bearer Token -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="250" height="210" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="250" height="32" rx="12" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="15" y="21" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      📱 PROTECTED API REQUEST
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      GET /api/v1/users/profile
    </text>
    <text x="15" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      Headers:
    </text>

    <rect x="15" y="95" width="220" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="115" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10">Authorization:</text>
    <text x="23" y="135" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">"Bearer eyJhbGciOi..."</text>
    <text x="23" y="160" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Gửi kèm Token khi truy vấn</text>
    <text x="23" y="175" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">các Endpoint riêng tư</text>
  </g>

  <!-- Arrow 1: Request -> JwtAuthGuard -->
  <g transform="translate(330, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#10b981"/>
  </g>

  <!-- 2. JwtAuthGuard & JwtStrategy Node -->
  <g transform="translate(395, 110)" filter="url(#shadow)">
    <rect width="370" height="220" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="370" height="32" rx="12" fill="#047857" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🛡️ JwtAuthGuard &amp; JwtStrategy
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      ExtractJwt.fromAuthHeaderAsBearerToken()
    </text>
    <text x="15" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      1. Extract Bearer Token from Header
    </text>
    <text x="15" y="101" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      2. Verify Signature with secretOrKey
    </text>
    <text x="15" y="124" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">
      3. validate(payload) ➔ Attach req.user
    </text>

    <!-- Verification Outcomes -->
    <rect x="15" y="142" width="165" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="162" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">🟢 Valid Token</text>
    <text x="23" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Pass to Handler</text>

    <rect x="190" y="142" width="165" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="198" y="162" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">🔴 Invalid / Expired</text>
    <text x="198" y="180" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9">401 Unauthorized</text>
  </g>

  <!-- Arrow 2: Guard -> Controller -->
  <g transform="translate(765, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#10b981" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#10b981"/>
  </g>

  <!-- 3. Protected Controller Execution Node -->
  <g transform="translate(830, 115)" filter="url(#shadow)">
    <rect width="290" height="210" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="290" height="32" rx="12" fill="#065f46" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      📄 PROTECTED CONTROLLER HANDLER
    </text>
    <text x="15" y="55" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
      @UseGuards(JwtAuthGuard)
    </text>
    <text x="15" y="78" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      getProfile(@Request() req)
    </text>
    
    <rect x="15" y="98" width="260" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="118" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">req.user = {</text>
    <text x="33" y="138" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">userId: "clx890...",</text>
    <text x="33" y="158" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">email: "alex@app.com"</text>
    <text x="23" y="176" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">}</text>
  </g>
</svg>
