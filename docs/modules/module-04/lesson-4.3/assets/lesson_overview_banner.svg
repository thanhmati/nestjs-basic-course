<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Primary Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0234e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing background lights -->
  <circle cx="200" cy="120" r="130" fill="#e0234e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="980" cy="260" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="110" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Outer Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="35" width="1100" height="330" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <path d="M 50 51 A 16 16 0 0 1 66 35 L 1134 35 A 16 16 0 0 1 1150 51 L 1150 78 L 50 78 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="56" r="6" fill="#ef4444"/>
    <circle cx="100" cy="56" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="56" r="6" fill="#10b981"/>
    <text x="145" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">docs/modules/module-04/lesson-4.3 — Guards Nền Tảng</text>
  </g>

  <!-- Header Left Content: Module & Lesson Title -->
  <g transform="translate(90, 115)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#e0234e" fill-opacity="0.2" stroke="#e0234e" stroke-width="1"/>
    <text x="55" y="17" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">MODULE 04</text>

    <rect x="120" y="0" width="130" height="26" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1"/>
    <text x="185" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">LESSON 4.3</text>

    <rect x="260" y="0" width="150" height="26" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
    <text x="335" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">NATIVE GUARD</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
      NestJS Guards Nền Tảng
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
      Kiểm soát quyền truy cập với <tspan fill="#38bdf8" font-weight="600">CanActivate</tspan> &amp; <tspan fill="#34d399" font-weight="600">ExecutionContext</tspan>
    </text>

    <!-- Bullet Highlights -->
    <g transform="translate(0, 130)">
      <circle cx="6" cy="6" r="4" fill="#e0234e"/>
      <text x="20" y="10" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Vị trí Guard trong Request Pipeline</text>

      <circle cx="6" cy="34" r="4" fill="#06b6d4"/>
      <text x="20" y="38" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Giải mã ExecutionContext &amp; switchToHttp()</text>

      <circle cx="6" cy="62" r="4" fill="#10b981"/>
      <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Tự tay dựng NativeAuthGuard không cần thư viện</text>
    </g>
  </g>

  <!-- Right Visual Flow Diagram -->
  <g transform="translate(590, 110)">
    <!-- Box 1: HTTP Request -->
    <g filter="url(#shadow)">
      <rect x="0" y="10" width="130" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <rect x="0" y="10" width="130" height="24" rx="10" fill="#334155"/>
      <text x="65" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">HTTP REQUEST</text>
      <text x="65" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">GET /profile</text>
      <text x="65" y="72" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Authorization:</text>
      <text x="65" y="86" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Bearer &lt;token&gt;</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 135 58 L 165 58" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="168,58 162,54 162,62" fill="#38bdf8"/>

    <!-- Box 2: Native Guard & CanActivate (Center Hero) -->
    <g filter="url(#shadow)">
      <rect x="175" y="0" width="175" height="115" rx="12" fill="#0f172a" stroke="#e0234e" stroke-width="1.8"/>
      <rect x="175" y="0" width="175" height="26" rx="12" fill="#e0234e" fill-opacity="0.2"/>
      <text x="262" y="18" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">🛡️ NativeAuthGuard</text>

      <text x="190" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">implements</text>
      <text x="190" y="58" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CanActivate</text>

      <line x1="185" y1="68" x2="340" y2="68" stroke="#334155" stroke-width="1"/>
      <text x="190" y="85" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">context.switchToHttp()</text>
      <text x="190" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">verify &amp; req['user']</text>
    </g>

    <!-- Branch Arrows from Guard -->
    <!-- Green Upper Branch: True -->
    <path d="M 355 42 L 385 42 L 385 25 L 400 25" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="405,25 398,21 398,29" fill="#10b981"/>
    <text x="375" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">TRUE</text>

    <!-- Red Lower Branch: False / Error -->
    <path d="M 355 75 L 385 75 L 385 92 L 400 92" fill="none" stroke="#ef4444" stroke-width="2"/>
    <polygon points="405,92 398,88 398,96" fill="#ef4444"/>
    <text x="370" y="106" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">FALSE</text>

    <!-- Box 3A: Controller Handler (Green) -->
    <g filter="url(#shadow)">
      <rect x="410" y="2" width="115" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="467" y="20" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Controller</text>
      <text x="467" y="36" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">🟢 200 OK</text>
    </g>

    <!-- Box 3B: Blocked Unauthorized (Red) -->
    <g filter="url(#shadow)">
      <rect x="410" y="68" width="115" height="46" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="467" y="86" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Unauthorized</text>
      <text x="467" y="102" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">🔴 401 Error</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="0" y="140" width="525" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="262" y="165" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
      🛡️ <tspan fill="#ffffff" font-weight="bold">Guard</tspan> trả về <tspan fill="#34d399" font-weight="bold">true</tspan> để cho phép hoặc ném <tspan fill="#f87171" font-weight="bold">UnauthorizedException</tspan> để chặn đứng request
    </text>
  </g>
</svg>
