<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="svgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1140" height="580" rx="16" fill="url(#svgBg)"/>
  <rect width="1138" height="578" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title Badge -->
  <g transform="translate(45, 34)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1"/>
    <text x="82" y="16" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      MODULE 04 • SECURITY
    </text>
    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">
      🔒 Kiến Trúc Băm Mật Khẩu bcrypt &amp; Giải Phẫu Chuỗi Hash 60 Ký Tự
    </text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Cơ chế Salt chống Rainbow Table, Cost Factor chống Brute-force và quy trình Register / Login
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION 1: DISSECTING 60-CHAR BCRYPT STRING (Top Section)                 -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 120)">
    <rect width="1050" height="155" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="1050" height="30" rx="12" fill="#1e293b"/>
    <text x="18" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      1️⃣ GIẢI PHẪU CẤU TRÚC CHUỖI BĂM BCRYPT (60 KÝ TỰ HOÀN HẢO)
    </text>

    <!-- Hash Code Bar -->
    <g transform="translate(20, 48)">
      <!-- Block 1: $2b$ -->
      <rect x="0" y="0" width="110" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="55" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">$2b$</text>

      <!-- Block 2: 10$ -->
      <rect x="120" y="0" width="90" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="165" y="26" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">10$</text>

      <!-- Block 3: Salt (22 chars) -->
      <rect x="220" y="0" width="370" height="42" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="405" y="26" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">e83U5x4H9kL0mN1oP2qR3u</text>

      <!-- Block 4: Hash (31 chars) -->
      <rect x="600" y="0" width="410" height="42" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
      <text x="805" y="26" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">4v5w6x7y8z9A0B1C2D3E4F5G6H7I8J9</text>
    </g>

    <!-- Labels for 4 Blocks -->
    <g transform="translate(20, 102)">
      <text x="55" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Thuật toán</text>
      <text x="55" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">bcrypt v2b</text>

      <text x="165" y="16" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cost Factor</text>
      <text x="165" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">2^10 = 1024 vòng</text>

      <text x="405" y="16" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Salt Ngẫu Nhiên (22 ký tự)</text>
      <text x="405" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">128-bit Salt ➔ Chống Rainbow Table</text>

      <text x="805" y="16" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Checksum Hash (31 ký tự)</text>
      <text x="805" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Hàm băm 1 chiều không thể dịch ngược</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION 2: REGISTER VS LOGIN WORKFLOW (Bottom Section)                    -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 295)">
    <rect width="1050" height="250" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="1050" height="30" rx="12" fill="#1e293b"/>
    <text x="18" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      2️⃣ QUY TRÌNH BĂM (REGISTER) VS SO SÁNH KHÔNG CẦN GIẢI MÃ (LOGIN)
    </text>

    <!-- Lane 1: Registration Flow -->
    <g transform="translate(20, 45)" filter="url(#softShadow)">
      <rect width="490" height="185" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="0" y="0" width="490" height="4" rx="2" fill="url(#cyanGrad)"/>
      <text x="16" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
        🟢 Quy Trình Đăng Ký (Register): Băm 1 Chiều
      </text>

      <rect x="12" y="36" width="466" height="135" rx="6" fill="#090d16"/>
      <text x="22" y="58" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">1. User nhập: "MySecret123!" (Plaintext)</text>
      <text x="22" y="80" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10.5">2. HashService.hashPassword(pwd, 10)</text>
      <text x="36" y="98" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">↳ bcrypt tự sinh 22 ký tự Salt ngẫu nhiên</text>
      <text x="22" y="122" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">3. prisma.user.create({ password: hash })</text>
      <text x="22" y="148" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">
        ✅ DB chỉ lưu Hash $2b$10$... — Mật khẩu thô bị tiêu hủy!
      </text>
    </g>

    <!-- Lane 2: Login Flow -->
    <g transform="translate(540, 45)" filter="url(#softShadow)">
      <rect width="490" height="185" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="490" height="4" rx="2" fill="url(#emeraldGrad)"/>
      <text x="16" y="24" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
        ⚡ Quy Trình Đăng Nhập (Login): So Sánh Constant-Time
      </text>

      <rect x="12" y="36" width="466" height="135" rx="6" fill="#090d16"/>
      <text x="22" y="58" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">1. User gửi: "MySecret123!" + Lấy Hash từ DB</text>
      <text x="22" y="80" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10.5">2. HashService.comparePassword(pwd, dbHash)</text>
      <text x="36" y="98" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">↳ bcrypt đọc Salt từ DB Hash, băm pwd rồi đối chiếu</text>
      <text x="22" y="122" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">3. Kết quả: true (Khớp) hoặc false (Sai mật khẩu)</text>
      <text x="22" y="148" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">
        🛡️ Chống Timing Attack bằng so sánh thời gian bất biến!
      </text>
    </g>
  </g>
</svg>
