<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Red / Security Accent -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Emerald / Green Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#ef4444" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 4.1: Secure Password Hashing Architecture (bcrypt &amp; Salt Rounds)
    </text>
  </g>

  <!-- 1. Plaintext Password Card -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="260" height="210" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      ⚠️ UNSECURE PLAINTEXT
    </text>
    <text x="15" y="55" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11">
      user_input_password
    </text>
    <text x="15" y="80" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      "SecretP@ssw0rd123"
    </text>
    
    <rect x="15" y="105" width="230" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="125" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">🔴 Nguy cơ rò rỉ:</text>
    <text x="23" y="145" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Nếu DB bị rò rỉ, Hacker nhìn</text>
    <text x="23" y="160" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">thấy trực tiếp MK người dùng</text>
    <text x="23" y="175" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">TUYỆT ĐỐI KHÔNG LƯU PLAIN TEXT!</text>
  </g>

  <!-- Arrow 1: Plaintext -> bcrypt Engine -->
  <g transform="translate(340, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#f59e0b"/>
  </g>

  <!-- 2. bcrypt Hashing Engine Card -->
  <g transform="translate(410, 115)" filter="url(#shadow)">
    <rect width="380" height="210" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="380" height="32" rx="12" fill="#854d0e" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fde047" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🔐 BCRYPT HASHING ENGINE
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      bcrypt.hash(password, saltRounds = 10)
    </text>
    <text x="15" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      1. Generates 128-bit Random Salt
    </text>
    <text x="15" y="101" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      2. Key Derivation via Blowfish Cipher (1024 rounds)
    </text>

    <!-- Sub-cards: hash vs compare -->
    <rect x="15" y="120" width="170" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="140" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">hash()</text>
    <text x="23" y="158" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Băm 1 chiều khi</text>
    <text x="23" y="173" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Đăng ký tài khoản</text>

    <rect x="195" y="120" width="170" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="203" y="140" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">compare()</text>
    <text x="203" y="158" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">So sánh an toàn khi</text>
    <text x="203" y="173" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Đăng nhập tài khoản</text>
  </g>

  <!-- Arrow 2: Engine -> One-Way Hash -->
  <g transform="translate(790, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#10b981" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#10b981"/>
  </g>

  <!-- 3. Secure One-Way Hash Card -->
  <g transform="translate(860, 115)" filter="url(#shadow)">
    <rect width="260" height="210" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#065f46" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🟢 SECURE ONE-WAY HASH
    </text>
    <text x="15" y="55" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">
      Stored in PostgreSQL DB:
    </text>
    
    <rect x="15" y="70" width="230" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="90" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">$2b$10$e83...xJ9K...</text>
    <text x="23" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">$2b$: Algo version</text>
    <text x="23" y="127" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">$10$: Cost factor (2^10)</text>

    <text x="15" y="165" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">
      ✅ Hàm 1 chiều (One-way)
    </text>
    <text x="15" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">
      Không thể giải mã ngược!
    </text>
  </g>
</svg>
