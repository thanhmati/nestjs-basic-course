<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#111625" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Code Block Background -->
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0c111d"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="70" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      MODULE 04 • LESSON 4.7
    </text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800">
      Phân Quyền RBAC (Role-Based Access Control) Với @Roles() &amp; RolesGuard
    </text>
  </g>

  <!-- ==================== CARD 1: @Roles() DECORATOR ==================== -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="520" height="252" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect width="520" height="34" rx="12" fill="#4338ca" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🏷️ 1. GẮN NHÃN QUYỀN TRUY CẬP: @Roles()
    </text>
    
    <text x="16" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Khai báo quyền bắt buộc tại Handler/Controller qua SetMetadata:
    </text>

    <!-- Code Box -->
    <rect x="14" y="64" width="492" height="138" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="84" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">// 1. Khởi tạo decorator Type-Safe từ Prisma Enum</text>
    <text x="22" y="100" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9.5">export const Roles = (...roles: Role[]) => SetMetadata(ROLES_KEY, roles);</text>
    <text x="22" y="122" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">// 2. Chỉ cấp quyền cho ADMIN truy xuất danh sách</text>
    <text x="22" y="138" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Roles(Role.ADMIN)</text>
    <text x="22" y="154" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get()</text>
    <text x="22" y="170" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">findAll() { return this.usersService.findAll(); }</text>

    <text x="16" y="224" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10.5">
      ➔ Linh hoạt áp dụng nhiều Roles: @Roles(Role.ADMIN, Role.MODERATOR)
    </text>
  </g>

  <!-- ==================== CARD 2: RolesGuard & Reflector ==================== -->
  <g transform="translate(630, 115)" filter="url(#shadow)">
    <rect width="520" height="252" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="520" height="34" rx="12" fill="#047857" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🛡️ 2. BẢO VỆ CHẶN CỔNG: RolesGuard &amp; Reflector
    </text>

    <text x="16" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      So khớp vai trò người dùng trong Token với quyền Route yêu cầu:
    </text>

    <!-- Code Box -->
    <rect x="14" y="64" width="492" height="138" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="84" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">// Đọc metadata từ Handler &amp; Class</text>
    <text x="22" y="100" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">const requiredRoles = this.reflector.getAllAndOverride&lt;Role[]&gt;(ROLES_KEY, [ ... ]);</text>
    <text x="22" y="116" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">if (!requiredRoles) return true; // Không yêu cầu role -> Cho qua</text>
    <text x="22" y="134" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">// So sánh role từ req.user (được giải mã từ JwtAuthGuard)</text>
    <text x="22" y="152" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">const hasRole = requiredRoles.includes(user.role);</text>
    <text x="22" y="170" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">if (!hasRole) throw new ForbiddenException('403 Forbidden');</text>

    <text x="16" y="224" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10.5">
      ➔ 401 Unauthorized (Chưa đăng nhập) vs 403 Forbidden (Sai quyền hạn)
    </text>
  </g>
</svg>
