<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="dtoHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="entityHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="centerPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="380" rx="14" fill="url(#bgGrad)"/>
  <rect width="958" height="378" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Main Title -->
  <g transform="translate(35, 28)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">
      ⚖️ Phân Định Ranh Giới: DTO (Giao Tiếp Mạng) vs Database Entity (Lưu Trữ CSDL)
    </text>
    <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Tại sao không bao giờ được dùng trực tiếp Database Model để hứng dữ liệu từ Client?
    </text>
  </g>

  <!-- CARD 1: DTO (LEFT) -->
  <g transform="translate(35, 75)" filter="url(#softShadow)">
    <rect width="360" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="4" rx="2" fill="url(#dtoHeader)"/>
    
    <!-- Header Tag -->
    <rect x="14" y="14" width="130" height="20" rx="4" fill="#0369a1" fill-opacity="0.3"/>
    <text x="22" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">🌐 NETWORK PAYLOAD</text>
    <text x="155" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">CreateUserDto</text>

    <!-- Code Body -->
    <rect x="14" y="44" width="332" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    
    <text x="26" y="68" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ username: string;</text>
    <text x="26" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ email: string;</text>
    <text x="26" y="112" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ password: string;</text>
    <text x="185" y="112" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">// Dạng thô</text>
    <text x="26" y="134" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ age: number;</text>

    <line x1="26" y1="148" x2="330" y2="148" stroke="#334155" stroke-dasharray="4,4"/>
    
    <!-- Prohibited fields in DTO -->
    <text x="26" y="172" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">🚫 role: UserRole;</text>
    <text x="175" y="172" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5">(Chặn client tự set admin)</text>
    <text x="26" y="196" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">🚫 passwordHash;</text>
    <text x="175" y="196" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5">(Bảo vệ bí mật CSDL)</text>
    <text x="26" y="214" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">🚫 id / createdAt;</text>
    <text x="175" y="214" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5">(Hệ thống tự sinh)</text>
  </g>

  <!-- CENTER: TRANSFORMATION ARROW -->
  <g transform="translate(415, 125)">
    <line x1="0" y1="65" x2="110" y2="65" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <rect x="8" y="25" width="105" height="26" rx="13" fill="url(#centerPill)"/>
    <text x="16" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">⚡ SERVICE LAYER</text>
    <text x="60" y="80" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Mã hóa mật khẩu</text>
    <text x="60" y="95" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">&amp; gán role = USER</text>
  </g>

  <!-- CARD 2: DATABASE ENTITY (RIGHT) -->
  <g transform="translate(565, 75)" filter="url(#softShadow)">
    <rect width="360" height="240" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="4" rx="2" fill="url(#entityHeader)"/>

    <!-- Header Tag -->
    <rect x="14" y="14" width="140" height="20" rx="4" fill="#065f46" fill-opacity="0.3"/>
    <text x="22" y="28" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">🛢️ PRISMA / POSTGRES</text>
    <text x="165" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">model User</text>

    <!-- Code Body -->
    <rect x="14" y="44" width="332" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    
    <text x="26" y="68" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">🔑 id: Int @id @default(autoincrement())</text>
    <text x="26" y="90" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ username: String</text>
    <text x="26" y="112" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">✓ email: String @unique</text>
    <text x="26" y="134" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5">🔒 passwordHash: String</text>
    <text x="235" y="134" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">// Đã băm an toàn</text>
    <text x="26" y="156" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">🛡️ role: Role @default(USER)</text>
    <text x="26" y="178" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11.5">🕒 createdAt: DateTime @default(now())</text>
    <text x="26" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11.5">🕒 updatedAt: DateTime @updatedAt</text>
  </g>

  <!-- BOTTOM TAKEAWAY NOTE -->
  <g transform="translate(35, 332)">
    <rect width="890" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
      💡 Nguyên Tắc Vàng:
    </text>
    <text x="145" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      DTO bảo vệ hệ thống khỏi việc rò rỉ thông tin bí mật và ngăn chặn kẻ xấu tự ý leo thang đặc quyền (Over-posting Attack)!
    </text>
  </g>
</svg>
