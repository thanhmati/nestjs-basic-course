<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Rose / Error Accent -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Amber Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#f43f5e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 3.4: NestJS Exception Filters (Global Error Handling &amp; Sanitization)
    </text>
  </g>

  <!-- 1. Uncaught Exception / Error Node -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="270" height="210" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="270" height="32" rx="12" fill="#9f1239" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      💥 THROW EXCEPTION / ERROR
    </text>
    <text x="15" y="55" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11">
      throw new NotFoundException(...)
    </text>
    <text x="15" y="80" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11">
      throw new BadRequestException(...)
    </text>
    <text x="15" y="105" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">
      Unhandled DB Error (Prisma/SQL)
    </text>
    
    <!-- Raw Stacktrace preview -->
    <rect x="15" y="125" width="240" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="145" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9">Error: Record not found</text>
    <text x="23" y="160" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">  at UsersService.findOne (users.ts:42)</text>
    <text x="23" y="175" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">  at processTicksAndRejections (node:internal)</text>
  </g>

  <!-- Arrow 1: Error -> Exception Filter -->
  <g transform="translate(350, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#f43f5e"/>
  </g>

  <!-- 2. NestJS HttpExceptionFilter Node -->
  <g transform="translate(420, 115)" filter="url(#shadow)">
    <rect width="360" height="210" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <rect width="360" height="32" rx="12" fill="#854d0e" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fde047" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🛡️ GLOBAL HTTP EXCEPTION FILTER
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      @Catch() export class HttpExceptionFilter
    </text>
    <text x="15" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      1. Extract: statusCode, message, error
    </text>
    <text x="15" y="101" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      2. Sanitize: Hide sensitive stack traces
    </text>
    <text x="15" y="124" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">
      3. Format: Return unified JSON Error
    </text>

    <rect x="15" y="142" width="330" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="161" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
      Internal Logger: Ghi log Stacktrace ra Terminal
    </text>
    <text x="23" y="178" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">
      Đảm bảo Production không lộ bí mật hệ thống
    </text>
  </g>

  <!-- Arrow 2: Filter -> Clean JSON Client -->
  <g transform="translate(780, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#fb7185" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#fb7185"/>
  </g>

  <!-- 3. Standardized Error Response Node -->
  <g transform="translate(850, 115)" filter="url(#shadow)">
    <rect width="270" height="210" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="270" height="32" rx="12" fill="#9f1239" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🔴 CLEAN JSON ERROR RESPONSE
    </text>
    <text x="15" y="55" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">
      {
    </text>
    <text x="25" y="75" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">
      "statusCode": 404,
    </text>
    <text x="25" y="95" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">
      "message": "User not found",
    </text>
    <text x="25" y="115" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10">
      "error": "Not Found",
    </text>
    <text x="25" y="135" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">
      "timestamp": "ISO...",
    </text>
    <text x="25" y="155" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">
      "path": "/api/v1/users/99"
    </text>
    <text x="15" y="175" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">
      }
    </text>
  </g>
</svg>
