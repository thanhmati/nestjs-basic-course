<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Blue / Versioning Accent -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Purple / V2 Accent -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 3.1: REST API Versioning Strategy (/api/v1/ &amp; /api/v2/)
    </text>
  </g>

  <!-- Central Router Node -->
  <g transform="translate(100, 130)" filter="url(#shadow)">
    <rect width="320" height="180" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="320" height="36" rx="12" fill="#0369a1" fill-opacity="0.4"/>
    
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
      🚀 NESTJS GLOBAL ROUTER
    </text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">
      setGlobalPrefix('api')
    </text>
    <text x="20" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">
      enableVersioning({
    </text>
    <text x="35" y="115" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      type: VersioningType.URI,
    </text>
    <text x="35" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      prefix: 'v'
    </text>
    <text x="20" y="165" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">
      })
    </text>
  </g>

  <!-- Branch Arrow 1 (v1) -->
  <g transform="translate(420, 175)">
    <path d="M 0 45 L 80 -15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="76,-22 88,-18 80,-8" fill="#38bdf8"/>
  </g>

  <!-- Branch Arrow 2 (v2) -->
  <g transform="translate(420, 220)">
    <path d="M 0 -5 L 80 45" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="80,48 88,38 76,34" fill="#a855f7"/>
  </g>

  <!-- Version 1 Card -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="530" height="95" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="530" height="28" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="15" y="19" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🟢 API VERSION 1 (Legacy App / Stable Client Support)
    </text>
    <text x="15" y="52" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      GET /api/v1/posts ➔ { "data": [...], "legacyFormat": true }
    </text>
    <text x="15" y="76" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      @Controller({ path: 'posts', version: '1' }) — Đảm bảo thiết bị cũ không bị crash
    </text>
  </g>

  <!-- Version 2 Card -->
  <g transform="translate(520, 235)" filter="url(#shadow)">
    <rect width="530" height="95" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="530" height="28" rx="10" fill="#6b21a8" fill-opacity="0.3"/>
    <text x="15" y="19" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🟣 API VERSION 2 (Modern App / Enhanced Payload &amp; Pagination)
    </text>
    <text x="15" y="52" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      GET /api/v2/posts ➔ { "items": [...], "meta": { "page": 1, "total": 100 } }
    </text>
    <text x="15" y="76" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      @Controller({ path: 'posts', version: '2' }) — Nâng cấp tính năng mà không ảnh hưởng v1
    </text>
  </g>
</svg>
