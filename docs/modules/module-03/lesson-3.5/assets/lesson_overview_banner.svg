<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#131627"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#101524" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Code Block Background -->
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d121e"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 38)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="70" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      MODULE 03 • LESSON 3.5
    </text>
    <text x="0" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800">
      NestJS Custom Decorators: Param Decorators &amp; Composition
    </text>
  </g>

  <!-- ==================== CARD 1: PARAM DECORATORS & PASSING DATA ==================== -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="340" height="250" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect width="340" height="34" rx="12" fill="#4338ca" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      1️⃣ PARAM DECORATOR &amp; DATA
    </text>
    <text x="16" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      createParamDecorator() &amp; Property Selector:
    </text>
    
    <!-- Code Box 1: Definition -->
    <rect x="14" y="64" width="312" height="88" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="84" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">export const ClientInfo =</text>
    <text x="22" y="101" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9.5">  createParamDecorator((data, ctx) => {</text>
    <text x="32" y="118" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">    const info = { ip: req.ip, agent: ... };</text>
    <text x="32" y="135" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">    return data ? info[data] : info;</text>
    <text x="22" y="146" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9.5">  });</text>

    <!-- Code Box 2: Usage in Controller -->
    <rect x="14" y="160" width="312" height="76" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="178" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Trích xuất trực tiếp từ Request thật:</text>
    <text x="22" y="197" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get('agent')</text>
    <text x="22" y="215" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">getAgent(<tspan fill="#38bdf8">@ClientInfo('userAgent')</tspan> agent: string) { ... }</text>
  </g>

  <!-- Arrow 1: Param -> Pipes -->
  <g transform="translate(395, 235)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="25,-4 32,0 25,4" fill="#818cf8"/>
  </g>

  <!-- ==================== CARD 2: WORKING WITH PIPES ==================== -->
  <g transform="translate(430, 115)" filter="url(#shadow)">
    <rect width="340" height="250" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="340" height="34" rx="12" fill="#047857" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      2️⃣ WORKING WITH PIPES
    </text>
    <text x="16" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Tương thích 100% với Validation &amp; Pipes:
    </text>

    <!-- Code Box 1: ValidationPipe integration -->
    <rect x="14" y="64" width="312" height="88" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="84" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Validate trực tiếp Custom Decorator:</text>
    <text x="22" y="103" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get('profile')</text>
    <text x="22" y="121" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">getProfile(</text>
    <text x="32" y="138" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">  @ClientInfo(new ValidationPipe()) data: Dto</text>
    <text x="22" y="146" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">) { ... }</text>

    <!-- Code Box 2: Custom Pipe Transformation -->
    <rect x="14" y="160" width="312" height="76" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="178" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Transform dữ liệu qua Pipes:</text>
    <text x="22" y="197" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get('port')</text>
    <text x="22" y="215" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">getPort(<tspan fill="#38bdf8">@ClientInfo('port', ParseIntPipe)</tspan> port: number)</text>
  </g>

  <!-- Arrow 2: Pipes -> applyDecorators -->
  <g transform="translate(775, 235)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="25,-4 32,0 25,4" fill="#a855f7"/>
  </g>

  <!-- ==================== CARD 3: DECORATOR COMPOSITION ==================== -->
  <g transform="translate(810, 115)" filter="url(#shadow)">
    <rect width="340" height="250" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="340" height="34" rx="12" fill="#7e22ce" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      3️⃣ DECORATOR COMPOSITION
    </text>
    <text x="16" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Gộp nhiều Decorators với applyDecorators():
    </text>

    <!-- Code Box 1: Composition Definition -->
    <rect x="14" y="64" width="312" height="88" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="83" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">export function Auth(...roles: string[]) {</text>
    <text x="32" y="100" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">  return applyDecorators(</text>
    <text x="42" y="117" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">    SetMetadata('roles', roles),</text>
    <text x="42" y="134" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">    UseGuards(AuthGuard, RolesGuard)</text>
    <text x="32" y="146" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">  );</text>
    <text x="22" y="152" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">}</text>

    <!-- Code Box 2: Clean Controller Usage -->
    <rect x="14" y="160" width="312" height="76" rx="6" fill="url(#codeBg)" stroke="#28324a" stroke-width="1"/>
    <text x="22" y="178" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Controller siêu gọn gàng (Single Annotation):</text>
    <text x="22" y="197" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get('admin-panel')</text>
    <text x="22" y="215" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">@Auth('admin')</text>
  </g>
</svg>
