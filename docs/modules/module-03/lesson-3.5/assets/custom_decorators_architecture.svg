<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="svgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Header & Accent Gradients -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1160" height="660" rx="16" fill="url(#svgBg)"/>
  <rect width="1158" height="658" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Main Title Area -->
  <g transform="translate(45, 36)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="1"/>
    <text x="82" y="16" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      NESTJS CORE CONCEPT
    </text>
    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">
      ⚡ Kiến Trúc Custom Param Decorators &amp; Decorator Composition
    </text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Trích xuất dữ liệu Type-Safe qua ExecutionContext &amp; Gom cụm siêu dữ liệu xóa bỏ Decorator Hell với applyDecorators()
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION A: createParamDecorator() PIPELINE (Upper Section)                 -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 125)">
    <!-- Container Outline -->
    <rect width="1070" height="255" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="32" rx="12" fill="#1e293b"/>
    <text x="18" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
      1️⃣ LUỒNG TRÍCH XUẤT THAM SỐ: createParamDecorator(factory)
    </text>

    <!-- Node 1: Incoming HTTP Request -->
    <g transform="translate(20, 48)" filter="url(#softShadow)">
      <rect width="180" height="185" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#cyanGrad)"/>
      <text x="14" y="24" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">HTTP Request</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Express req thô:</text>

      <rect x="10" y="52" width="160" height="120" rx="6" fill="#090d16"/>
      <text x="18" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">req.headers</text>
      <text x="18" y="94" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">req.ip</text>
      <text x="18" y="114" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">req.user (JWT)</text>
      <text x="18" y="134" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">req.session</text>
      <text x="18" y="156" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">⚠️ Dính chặt Express</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(200, 140)">
      <path d="M 0 0 L 25 0" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
      <polygon points="25,-4 32,0 25,4" fill="#06b6d4"/>
    </g>

    <!-- Node 2: ExecutionContext -->
    <g transform="translate(235, 48)" filter="url(#softShadow)">
      <rect width="210" height="185" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="4" rx="2" fill="url(#indigoGrad)"/>
      <text x="14" y="24" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">ExecutionContext</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">ctx trừu tượng hóa giao thức:</text>

      <rect x="10" y="52" width="190" height="120" rx="6" fill="#090d16"/>
      <text x="18" y="74" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">ctx.switchToHttp()</text>
      <text x="24" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">.getRequest&lt;Request&gt;()</text>
      <text x="18" y="114" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">ctx.switchToWs()</text>
      <text x="18" y="134" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">ctx.switchToRpc()</text>
      <text x="18" y="156" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">✨ Độc lập giao thức</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(445, 140)">
      <path d="M 0 0 L 25 0" fill="none" stroke="#818cf8" stroke-width="2.5"/>
      <polygon points="25,-4 32,0 25,4" fill="#818cf8"/>
    </g>

    <!-- Node 3: Custom Param Decorator Factory Function -->
    <g transform="translate(480, 48)" filter="url(#softShadow)">
      <rect width="270" height="185" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="4" rx="2" fill="url(#emeraldGrad)"/>
      <text x="14" y="24" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Factory Function (data, ctx)</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">createParamDecorator((data, ctx) =&gt; ...)</text>

      <rect x="10" y="52" width="250" height="120" rx="6" fill="#090d16"/>
      <text x="18" y="74" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">const req = ctx.switchToHttp()...</text>
      <text x="18" y="92" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">const user = req.user;</text>
      <path d="M 18 102 L 250 102" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="18" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">data ? user[data] : user</text>
      <text x="18" y="142" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">↳ data = null: Lấy nguyên Object</text>
      <text x="18" y="158" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">↳ data = 'id': Lấy trường con 'id'</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <g transform="translate(750, 140)">
      <path d="M 0 0 L 25 0" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <polygon points="25,-4 32,0 25,4" fill="#10b981"/>
    </g>

    <!-- Node 4: Controller Handler (Clean, Type-Safe) -->
    <g transform="translate(785, 48)" filter="url(#softShadow)">
      <rect width="265" height="185" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="4" rx="2" fill="url(#amberGrad)"/>
      <text x="14" y="24" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Controller Route Handler</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Tiêu thụ sạch sẽ, Type-Safe 100%:</text>

      <rect x="10" y="52" width="245" height="120" rx="6" fill="#090d16"/>
      <text x="16" y="74" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">@Get('profile')</text>
      <text x="16" y="94" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">getProfile(</text>
      <text x="24" y="114" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">  @CurrentUser() user: UserEntity</text>
      <text x="16" y="132" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">) { return user; }</text>
      <text x="16" y="156" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">✅ Dễ dàng Unit Test &amp; Mock</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION B: applyDecorators() COMPOSITION (Lower Section)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 405)">
    <rect width="1070" height="225" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="32" rx="12" fill="#1e293b"/>
    <text x="18" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
      2️⃣ GỘP DECORATORS (DECORATOR COMPOSITION): applyDecorators(...)
    </text>

    <!-- Sub-node B1: Decorator Hell (Stacked Annotations) -->
    <g transform="translate(20, 46)" filter="url(#softShadow)">
      <rect width="320" height="160" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
      <rect x="0" y="0" width="320" height="4" rx="2" fill="url(#roseGrad)"/>
      <text x="14" y="22" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">
        🔴 Bị Rối Mắt (Decorator Hell - 5-6 Annotations)
      </text>

      <rect x="10" y="32" width="300" height="116" rx="6" fill="#090d16"/>
      <text x="18" y="52" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">@SetMetadata('roles', roles)</text>
      <text x="18" y="70" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">@UseGuards(AuthGuard, RolesGuard)</text>
      <text x="18" y="88" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">@ApiBearerAuth()</text>
      <text x="18" y="106" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">@ApiResponse({ status: 403, desc: '...' })</text>
      <text x="18" y="128" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9.5">⚠️ Trùng lặp code tại hàng chục Controllers</text>
    </g>

    <!-- Composition Arrow & Engine -->
    <g transform="translate(355, 95)">
      <rect x="0" y="0" width="280" height="65" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#purpleGrad)"/>
      <text x="140" y="26" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        Hàm Gom Cụm applyDecorators()
      </text>
      <text x="140" y="48" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">
        export function Auth(...roles) { ... }
      </text>

      <!-- Connecting arrows -->
      <path d="M -15 32 L -2 32" fill="none" stroke="#f43f5e" stroke-width="2"/>
      <path d="M 282 32 L 298 32" fill="none" stroke="#a855f7" stroke-width="2"/>
      <polygon points="298,28 306,32 298,36" fill="#a855f7"/>
    </g>

    <!-- Sub-node B2: Clean Single Composite Decorator -->
    <g transform="translate(680, 46)" filter="url(#softShadow)">
      <rect width="370" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="370" height="4" rx="2" fill="url(#emeraldGrad)"/>
      <text x="14" y="22" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">
        🟢 Clean Code Đạt Chuẩn (Single Composite Decorator)
      </text>

      <rect x="10" y="32" width="350" height="116" rx="6" fill="#090d16"/>
      <text x="18" y="54" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">@Get('admin/dashboard')</text>
      <text x="18" y="74" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">@Auth('ADMIN')  // 👈 1 dòng duy nhất!</text>
      <text x="18" y="94" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">getDashboard(@CurrentUser() admin: User) {</text>
      <text x="28" y="112" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">return this.adminService.getStats();</text>
      <text x="18" y="130" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">}</text>
    </g>
  </g>
</svg>
