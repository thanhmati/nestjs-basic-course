<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="svgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="clientBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="middlewareBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="coreBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="finishBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1140" height="560" rx="16" fill="url(#svgBg)"/>
  <rect width="1138" height="558" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Title Badge -->
  <g transform="translate(45, 34)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
      ⚡ Kiến Trúc Vòng Đời HTTP Middleware &amp; Cơ Chế Event-Driven Logging Trong NestJS
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Từ khi Request chạm vào Server, gọi next(), Controller xử lý, đến khi Response kích hoạt sự kiện finish
    </text>
  </g>

  <!-- COLUMN 1: CLIENT REQUEST (X: 45) -->
  <g transform="translate(45, 95)" filter="url(#softShadow)">
    <rect width="230" height="420" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="5" rx="2.5" fill="url(#clientBar)"/>
    
    <text x="16" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">📱 1. HTTP Client Request</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Khởi tạo kết nối TCP / HTTP</text>
    
    <rect x="14" y="65" width="202" height="30" rx="5" fill="#0f172a"/>
    <text x="22" y="85" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">GET /api/v1/posts</text>

    <!-- Info Card -->
    <rect x="14" y="110" width="202" height="230" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="132" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">// HTTP Headers &amp; Meta</text>
    <text x="22" y="155" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">• Method: <tspan fill="#38bdf8">GET</tspan></text>
    <text x="22" y="177" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">• URL: <tspan fill="#38bdf8">/api/v1/posts</tspan></text>
    <text x="22" y="199" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">• IP: <tspan fill="#f59e0b">::1</tspan></text>
    <text x="22" y="221" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">• Agent: <tspan fill="#10b981">curl/8.7</tspan></text>
    <text x="22" y="243" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">• Body: <tspan fill="#94a3b8">empty</tspan></text>

    <rect x="20" y="270" width="190" height="55" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="26" y="290" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Tầng đầu tiên tiếp nhận:</text>
    <text x="26" y="308" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Duy nhất Middleware truy cập</text>
    <text x="26" y="322" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">trực tiếp native req, res!</text>

    <text x="16" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Chưa qua Auth Guard</text>
    <text x="16" y="395" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Chưa qua Validation Pipe</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="275" y1="305" x2="330" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- COLUMN 2: LOGGER MIDDLEWARE (X: 340) -->
  <g transform="translate(340, 80)" filter="url(#softShadow)">
    <rect width="275" height="450" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="0" y="0" width="275" height="6" rx="3" fill="url(#middlewareBar)"/>

    <text x="18" y="32" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚙️ 2. LoggerMiddleware</text>
    <text x="18" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Triển khai NestMiddleware.use()</text>

    <!-- Step A: Timestamp capture -->
    <rect x="14" y="65" width="247" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="87" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">BƯỚC A: Đánh Dấu Thời Gian</text>
    <text x="24" y="107" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">const startTime = Date.now()</text>
    <text x="24" y="126" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Bắt đầu bấm giờ (Millisecond)</text>
    <text x="24" y="141" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Trích xuất method, originalUrl, ip</text>

    <!-- Step B: Event listener registration -->
    <rect x="14" y="160" width="247" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="182" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">BƯỚC B: Lắng Nghe Sự Kiện Finish</text>
    <text x="24" y="202" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">res.on('finish', () =&gt; { ... })</text>
    <text x="24" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Đăng ký callback bất đồng bộ</text>
    <text x="24" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• KHÔNG chặn luồng thực thi chính</text>
    <text x="24" y="254" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Chỉ kích hoạt khi Response xong xuôi</text>

    <!-- Step C: next() execution -->
    <rect x="14" y="280" width="247" height="95" rx="8" fill="#111827" stroke="#e0234e" stroke-width="1.2"/>
    <text x="24" y="302" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">BƯỚC C: Gọi next() Chuyển Tiếp</text>
    <text x="24" y="324" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">next();</text>
    <text x="24" y="344" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">⚠️ BẮT BUỘC: Quên gọi next() sẽ</text>
    <text x="24" y="360" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">làm Request bị kẹt Timeout vĩnh viễn!</text>

    <text x="18" y="415" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cơ chế Non-blocking I/O</text>
    <text x="18" y="432" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Bảo đảm hiệu năng cao nhất</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <line x1="615" y1="305" x2="670" y2="305" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- COLUMN 3: NESTJS PIPELINE & CONTROLLER (X: 680) -->
  <g transform="translate(680, 95)" filter="url(#softShadow)">
    <rect width="210" height="420" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="5" rx="2.5" fill="url(#coreBar)"/>

    <text x="16" y="28" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">🚀 3. Request Pipeline</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Xử lý nghiệp vụ Backend</text>

    <!-- Sub boxes for pipeline -->
    <rect x="14" y="65" width="182" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="85" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🛡️ Guards (Auth)</text>
    <text x="24" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Kiểm tra Token / JWT</text>

    <rect x="14" y="120" width="182" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="140" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🔄 Interceptors</text>
    <text x="24" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Biến đổi luồng dữ liệu</text>

    <rect x="14" y="175" width="182" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="195" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚡ Pipes (Validation)</text>
    <text x="24" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Validate DTO &amp; Ép kiểu</text>

    <rect x="14" y="230" width="182" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="24" y="250" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">📄 Controller Handler</text>
    <text x="24" y="268" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">PostsController.get()</text>
    <text x="24" y="286" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Gọi Service &amp; Database</text>
    <text x="24" y="298" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Chuẩn bị HTTP Response</text>

    <text x="16" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Xong nghiệp vụ, gửi gói tin</text>
    <text x="16" y="395" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">về qua luồng Response</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <line x1="890" y1="305" x2="940" y2="305" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- COLUMN 4: FINISH EVENT & CONSOLE LOG (X: 950) -->
  <g transform="translate(950, 95)" filter="url(#softShadow)">
    <rect width="145" height="420" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="5" rx="2.5" fill="url(#finishBar)"/>

    <text x="14" y="28" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">📤 4. Response</text>
    <text x="14" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Sự kiện 'finish'</text>

    <rect x="10" y="65" width="125" height="40" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="16" y="82" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">res.emit('finish')</text>
    <text x="16" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Bytes sent to Client</text>

    <!-- Calculated delta -->
    <rect x="10" y="115" width="125" height="60" rx="4" fill="#0f172a"/>
    <text x="16" y="132" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">⏱️ Đo độ trễ:</text>
    <text x="16" y="148" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">now - startTime</text>
    <text x="16" y="164" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">= +14ms</text>

    <!-- Log Output Preview -->
    <rect x="10" y="185" width="125" height="150" rx="4" fill="#020617" stroke="#334155" stroke-width="1"/>
    <text x="14" y="202" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">// Log Output:</text>
    <text x="14" y="220" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">GET /posts</text>
    <text x="14" y="238" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">200 OK</text>
    <text x="14" y="256" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">+14ms</text>
    <text x="14" y="274" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">size: 128b</text>
    <text x="14" y="292" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">ip: ::1</text>
    <text x="14" y="316" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">STATUS: LOGGED</text>

    <text x="12" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Không làm chậm</text>
    <text x="12" y="392" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">thời gian trả về</text>
  </g>
</svg>
