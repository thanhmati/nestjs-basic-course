<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Amber / Logger Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 3.3: NestJS HTTP Logger Middleware (Request Lifecycle &amp; Interception)
    </text>
  </g>

  <!-- 1. Client Request Node -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <rect width="240" height="190" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect width="240" height="32" rx="12" fill="#1e293b"/>
    <text x="15" y="21" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      📱 HTTP CLIENT REQUEST
    </text>
    <text x="15" y="58" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      GET /api/v1/posts
    </text>
    <text x="15" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      Host: localhost:3000
    </text>
    <text x="15" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      User-Agent: Mozilla/5.0
    </text>
    <text x="15" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      Remote-IP: ::1
    </text>
    <text x="15" y="165" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
      Start Timer: <tspan fill="#f59e0b">Date.now()</tspan>
    </text>
  </g>

  <!-- Arrow 1: Request -> LoggerMiddleware -->
  <g transform="translate(325, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#f59e0b"/>
  </g>

  <!-- 2. NestJS LoggerMiddleware Node -->
  <g transform="translate(395, 110)" filter="url(#shadow)">
    <rect width="390" height="210" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="390" height="32" rx="12" fill="#b45309" fill-opacity="0.3"/>
    <text x="15" y="21" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      ⚙️ LOGGER MIDDLEWARE (NestMiddleware)
    </text>
    <text x="15" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      use(req: Request, res: Response, next: NextFunction)
    </text>
    <text x="15" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      1. Extract: method, originalUrl, ip, userAgent
    </text>
    <text x="15" y="101" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      2. Listen: res.on('finish', () => { ... })
    </text>
    <text x="15" y="124" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">
      3. Call: next() ➔ Pass to Controllers
    </text>

    <!-- Terminal Output Card Inside -->
    <rect x="15" y="140" width="360" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="159" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
      LOG: [HTTP] GET /api/v1/posts 200 +14ms
    </text>
    <text x="23" y="178" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">
      IP: ::1 | User-Agent: curl/8.7.1
    </text>
  </g>

  <!-- Arrow 2: Middleware -> Controller -->
  <g transform="translate(790, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#06b6d4"/>
  </g>

  <!-- 3. Target Controller / Route Handler -->
  <g transform="translate(860, 120)" filter="url(#shadow)">
    <rect width="260" height="190" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#0e7490" fill-opacity="0.3"/>
    <text x="15" y="21" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🎯 ROUTE HANDLER
    </text>
    <text x="15" y="58" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
      @Get('posts')
    </text>
    <text x="15" y="82" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      getPostsV1()
    </text>
    <text x="15" y="115" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Xử lý logic nghiệp vụ, gọi Service &amp; Database
    </text>
    <text x="15" y="155" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
      HTTP 200 OK Response ➔
    </text>
  </g>
</svg>
