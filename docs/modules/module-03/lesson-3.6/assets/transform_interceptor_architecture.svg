<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="svgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Header & Accent Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1140" height="540" rx="16" fill="url(#svgBg)"/>
  <rect width="1138" height="538" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Main Title Area -->
  <g transform="translate(45, 34)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1"/>
    <text x="82" y="16" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      NESTJS DOCS STANDARD
    </text>
    <text x="0" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">
      ⚡ Kiến Trúc TransformInterceptor: Response Mapping Với RxJS
    </text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Cơ chế CallHandler next.handle(), bọc dữ liệu thành công qua toán tử map() và kiểm soát bằng Decorators
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN WORKFLOW (3 COLUMNS)                                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(45, 115)">
    <!-- 1. Controller Output Node -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
      <rect width="280" height="380" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#blueGrad)"/>

      <text x="16" y="26" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
        1. Controller Route Handler
      </text>
      <text x="16" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
        Tập trung 100% vào nghiệp vụ
      </text>

      <rect x="14" y="58" width="252" height="155" rx="6" fill="#090d16"/>
      <text x="22" y="82" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10.5">@Get('posts')</text>
      <text x="22" y="102" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">findAll() {</text>
      <text x="32" y="122" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">  // Query Prisma DB</text>
      <text x="32" y="142" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">  return this.service.find();</text>
      <text x="22" y="162" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">}</text>
      <text x="22" y="184" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">➔ Trả về Raw Data: [{...}]</text>
      <text x="22" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">   (Array, Object, Primitive)</text>

      <rect x="14" y="225" width="252" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="24" y="248" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        💡 Lợi ích Clean Code:
      </text>
      <text x="24" y="270" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">
        • Không phải bọc `{ statusCode: 200 }` thủ công ở từng hàm.
      </text>
      <text x="24" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">
        • Controller trả về đúng Domain Entity hoặc DTO.
      </text>
      <text x="24" y="340" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5">
        • Viết Unit Test siêu nhanh!
      </text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(285, 175)">
      <path d="M 0 0 L 35 0" fill="none" stroke="#10b981" stroke-width="3"/>
      <polygon points="35,-5 45,0 35,5" fill="#10b981"/>
      <text x="22" y="-12" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Observable</text>
    </g>

    <!-- 2. TransformInterceptor Engine Node -->
    <g transform="translate(335, 0)" filter="url(#softShadow)">
      <rect width="380" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="380" height="4" rx="2" fill="url(#emeraldGrad)"/>

      <text x="18" y="26" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
        2. TransformInterceptor (RxJS map)
      </text>
      <text x="18" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
        implements NestInterceptor&lt;T, ApiResponse&lt;T&gt;&gt;
      </text>

      <rect x="14" y="58" width="352" height="302" rx="6" fill="#090d16"/>
      
      <!-- Stage 1: ExecutionContext check -->
      <rect x="22" y="70" width="336" height="45" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="32" y="88" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">context.getType() !== 'http'</text>
      <text x="32" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">➔ Bỏ qua nếu là WebSockets hoặc Microservices</text>

      <!-- Stage 2: Bypass check -->
      <rect x="22" y="125" width="336" height="52" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="32" y="144" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="10">@BypassTransform() ?</text>
      <text x="32" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">➔ Bỏ qua đóng gói, trả raw (File, Export Excel, SSE)</text>

      <!-- Stage 3: next.handle().pipe(map(...)) -->
      <rect x="22" y="187" width="336" height="85" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="32" y="206" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">next.handle().pipe(map(data =&gt; ...))</text>
      <text x="32" y="226" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Lấy statusCode từ response (200, 201)</text>
      <text x="32" y="244" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Lấy message từ @ResponseMessage()</text>
      <text x="32" y="260" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">• Bọc data vào Envelope chuẩn Enterprise</text>

      <!-- Summary footer -->
      <text x="32" y="300" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        ✨ Đăng ký 1 lần với APP_INTERCEPTOR
      </text>
      <text x="32" y="322" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">
        Áp dụng tự động trên 100% routes toàn hệ thống!
      </text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(720, 175)">
      <path d="M 0 0 L 35 0" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <polygon points="35,-5 45,0 35,5" fill="#06b6d4"/>
      <text x="22" y="-12" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">ApiResponse</text>
    </g>

    <!-- 3. Standardized JSON Envelope Node -->
    <g transform="translate(770, 0)" filter="url(#softShadow)">
      <rect width="280" height="380" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#cyanGrad)"/>

      <text x="16" y="26" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
        3. Standard Success JSON
      </text>
      <text x="16" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
        Hợp đồng dữ liệu nhất quán (Contract)
      </text>

      <rect x="14" y="58" width="252" height="210" rx="6" fill="#090d16"/>
      <text x="22" y="80" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">{</text>
      <text x="30" y="100" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">  "statusCode": 200,</text>
      <text x="30" y="120" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">  "message": "Thành công!",</text>
      <text x="30" y="140" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">  "data": [</text>
      <text x="40" y="160" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    { "id": 1, "title": "..." }</text>
      <text x="30" y="180" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">  ],</text>
      <text x="30" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">  "timestamp": "2026-...",</text>
      <text x="30" y="220" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">  "path": "/api/v1/posts"</text>
      <text x="22" y="240" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">}</text>

      <rect x="14" y="280" width="252" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="24" y="304" fill="#a5f3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        🛡️ Đối xứng hoàn hảo:
      </text>
      <text x="24" y="324" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">
        Khớp 100% với cấu trúc của
      </text>
      <text x="24" y="342" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">
        HttpExceptionFilter (Lesson 3.4)
      </text>
    </g>
  </g>
</svg>
