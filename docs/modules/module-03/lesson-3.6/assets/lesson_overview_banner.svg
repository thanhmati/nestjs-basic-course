<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald / Success Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="120" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <path d="M 50 56 A 16 16 0 0 1 66 40 L 1134 40 A 16 16 0 0 1 1150 56 L 1150 85 L 50 85 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="100" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="62" r="6" fill="#10b981"/>
    
    <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
      Lesson 3.5: NestJS Interceptors (Transform Success Response &amp; Performance Logging)
    </text>
  </g>

  <!-- 1. Controller Output Node -->
  <g transform="translate(80, 115)" filter="url(#shadow)">
    <rect width="260" height="210" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="15" y="21" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🚀 CONTROLLER HANDLER
    </text>
    <text x="15" y="55" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
      @Get('users')
    </text>
    <text x="15" y="78" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">
      getUsers()
    </text>
    <text x="15" y="105" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">
      Trả về Raw Data:
    </text>

    <rect x="15" y="120" width="230" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="140" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">[</text>
    <text x="33" y="158" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">{ "id": 1, "name": "Alex" }</text>
    <text x="23" y="176" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">]</text>
  </g>

  <!-- Arrow 1: Controller -> Interceptors -->
  <g transform="translate(340, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="55,-5 65,0 55,5" fill="#10b981"/>
  </g>

  <!-- 2. NestJS Interceptors Node -->
  <g transform="translate(410, 115)" filter="url(#shadow)">
    <rect width="380" height="210" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="380" height="32" rx="12" fill="#047857" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      ⚡ NESTJS INTERCEPTOR PIPELINE (RxJS)
    </text>
    
    <!-- Sub-card 1: TransformInterceptor -->
    <rect x="15" y="48" width="350" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="68" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. TransformInterceptor (map operator)</text>
    <text x="23" y="88" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Wrap data ➔ { statusCode, message, data, ... }</text>
    <text x="23" y="104" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9">Check @ResponseMessage() &amp; @BypassTransform()</text>

    <!-- Sub-card 2: LoggingInterceptor -->
    <rect x="15" y="128" width="350" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="23" y="148" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. LoggingInterceptor (tap operator)</text>
    <text x="23" y="168" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Measure: Date.now() - now ➔ Log +14ms</text>
  </g>

  <!-- Arrow 2: Interceptor -> Standard Success JSON -->
  <g transform="translate(790, 205)">
    <path d="M 0 0 L 55 0" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <polygon points="55,-5 65,0 55,5" fill="#06b6d4"/>
  </g>

  <!-- 3. Standardized Success Response Node -->
  <g transform="translate(860, 115)" filter="url(#shadow)">
    <rect width="260" height="210" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#0e7490" fill-opacity="0.4"/>
    <text x="15" y="21" fill="#a5f3fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
      🟢 CLEAN SUCCESS JSON
    </text>
    <text x="15" y="55" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">
      {
    </text>
    <text x="25" y="73" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">
      "statusCode": 200,
    </text>
    <text x="25" y="91" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">
      "message": "Thành công!",
    </text>
    <text x="25" y="109" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">
      "data": [...],
    </text>
    <text x="25" y="127" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">
      "timestamp": "ISO...",
    </text>
    <text x="25" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">
      "path": "/api/v1/users"
    </text>
    <text x="15" y="165" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">
      }
    </text>
    <text x="15" y="190" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">
      ⏱️ Logged: +14ms
    </text>
  </g>
</svg>
