<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestJS WebSocket Test Client</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        padding: 24px;
        display: flex;
        justify-content: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 600px;
        padding: 20px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: #f1f5f9;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 12px;
      }
      .badge-on {
        background: #dcfce7;
        color: #166534;
      }
      .badge-off {
        background: #fee2e2;
        color: #991b1b;
      }
      .chat-box {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        height: 300px;
        overflow-y: auto;
        padding: 12px;
        background: #fafafa;
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 80%;
        font-size: 14px;
      }
      .msg-in {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        align-self: flex-start;
      }
      .msg-out {
        background: #e0e7ff;
        border: 1px solid #c7d2fe;
        color: #1e1b4b;
        align-self: flex-end;
      }
      .msg-meta {
        font-size: 11px;
        color: #64748b;
        margin-top: 4px;
        display: block;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #6366f1;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-send {
        background: #4f46e5;
        color: white;
      }
      .btn-send:hover {
        background: #4338ca;
      }
      .btn-ping {
        background: #e2e8f0;
        font-size: 13px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin-bottom: 12px">⚡ NestJS WebSocket Chat</h2>

      <div class="status-bar">
        <span>Namespace: <code>/chat</code></span>
        <span id="badge" class="badge badge-off">Đang kết nối...</span>
      </div>

      <div style="display: flex; gap: 8px; align-items: center">
        <button class="btn-ping" onclick="ping()">Heartbeat Ping</button>
        <span
          id="latency"
          style="font-size: 13px; color: #64748b; margin-bottom: 12px"
        ></span>
      </div>

      <div id="box" class="chat-box"></div>

      <div class="row">
        <input
          id="sender"
          placeholder="Tên của bạn"
          value="Học viên"
          style="width: 130px"
        />
        <input
          id="msg"
          placeholder="Nhập tin nhắn..."
          style="flex: 1"
          onkeypress="if (event.key === 'Enter') send();"
        />
        <button class="btn-send" onclick="send()">Gửi</button>
      </div>
    </div>

    <script>
      // 1. Kết nối tới Namespace /chat trên cổng 3000
      const socket = io('http://localhost:3000/chat');
      const box = document.getElementById('box');
      const badge = document.getElementById('badge');
      const latency = document.getElementById('latency');

      socket.on('connect', () => {
        badge.textContent = `🟢 Online (ID: ${socket.id})`;
        badge.className = 'badge badge-on';
      });

      socket.on('disconnect', () => {
        badge.textContent = '🔴 Offline';
        badge.className = 'badge badge-off';
      });

      // 2. Nhận tin nhắn broadcast từ Server
      socket.on('new_message', (data) => {
        const isMine = data.senderSocketId === socket.id;
        const el = document.createElement('div');
        el.className = `msg ${isMine ? 'msg-out' : 'msg-in'}`;
        el.innerHTML = `<strong>${data.sender}</strong>: ${data.content} <span class="msg-meta">${new Date(data.timestamp).toLocaleTimeString()}</span>`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
      });

      // 3. Gửi tin nhắn qua sự kiện 'chat_message'
      function send() {
        const input = document.getElementById('msg');
        const content = input.value.trim();
        const sender =
          document.getElementById('sender').value.trim() || 'Ẩn danh';
        if (!content) return;

        socket.emit('chat_message', { sender, content }, (ack) => {
          console.log('✅ Server đã nhận tin (Acknowledgment):', ack);
        });

        input.value = '';
        input.focus();
      }

      // 4. Đo độ trễ khứ hồi (RTT Latency)
      function ping() {
        const start = Date.now();
        socket.emit('ping', (res) => {
          latency.textContent = `Phản hồi: "${res}" — Độ trễ: ${Date.now() - start}ms`;
        });
      }
    </script>
  </body>
</html>
